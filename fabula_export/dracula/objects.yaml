  canonical_name: Dracula's Containment Unit Furniture Set
  description: A set of sturdy furniture (including a chair and table) furnishing
    Dracula's high-security containment unit, serving as the primary functional and
    psychological anchor during Zoe Helsing's tense confrontations with the vampire.
    The **chair** orients participants in close quarters, heightening tension without
    direct handling, while the **table** provides a surface for interactions (e.g.,
    iPad use, blood extraction). Guards stand watch as Bloxham and Frank Renfield
    enter the scene, with the furnishings anchoring the utilitarian space amid psychological
    duels and revelations of Zoe's mortality. The setup offers minimal comfort in
    the sterile prison environment, softening the edges of Dracula's captivity.
  purpose: Furniture providing surface support in secure containment cell
  significance: ''
  potential_owner_mention: ''
