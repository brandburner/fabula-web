  canonical_name: Demeter's Ship’s Wheel
  description: The ship’s wheel aboard the *Demeter*, a weathered wooden helm central
    to the vessel’s navigation during its ill-fated voyage. Portmann initially grips
    its spokes to steer through storm-lashed seas, but Dracula’s attack at the wheel—where
    blood sprays across its surface as Portmann slumps—transforms it into a symbol
    of the crew’s doomed struggle. Later, Sokolov takes the helm, gripping it tightly
    as the ship’s fate unfolds amid Adisa’s defiance and the encroaching horror of
    Dracula’s presence. The wheel’s creaking rhythm and fixed position on the deck
    anchor the narrative’s tension, serving as both a practical tool for steering
    and a grim stage for the crew’s unraveling.
  purpose: Steer the Demeter and maintain its course during voyages
  significance: Anchors crew authority over the ship until Dracula's attack on Portmann
    there seizes control, symbolizing the vampire's takeover and the vessel's plunge
    into doom
  potential_owner_mention: Portmann
