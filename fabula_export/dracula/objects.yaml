  description: A **tactile fabric object** (likely a silk or linen handkerchief) that
    Lord Ruthven **clutches and sobs into** after Dorabella’s disappearance. Its **physical
    state** (soaked with tears) **visually reinforces his grief**, and its use in
    a **public breakdown** **fuels crew paranoia** and Dracula’s manipulation.
  purpose: Dab tears and mucus during emotional distress
  significance: Highlights Lord Ruthven's vulnerability and amplifies the scene's
    tension, as his breakdown fuels suspicion and plays into Dracula's strategy of
