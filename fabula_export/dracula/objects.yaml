- fabula_uuid: object_c9c1f3b0b227
  global_id: null
  canonical_name: Locked Doors of Dracula's Castle
  description: Several heavy doors, secured with unyielding locks, bar Jonathan Harker's
    path as he maps the castle's twisting corridors. He grasps handles and pushes
    against them during his escape attempt, but they hold firm, channeling him deeper
    into the maze and amplifying the suffocating isolation. Their presence turns every
    hallway into a potential dead end.
  purpose: Block access to rooms and passages, confining explorers within the castle
  significance: These doors erode Harker's reliance on logic and mapping, forcing
