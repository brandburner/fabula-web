  canonical_name: Dracula’s Black Blood (Moonlit Abbey Ruin)
  description: Dracula clutches his stomach and vomits black blood across the stone
    floor of the moonlit abbey ruins during a charged confrontation with Zoe Helsing.
    The viscous, unnatural substance gleams darkly under moonlight, splattering in
    a grotesque display that defies his immortal physiology. Zoe watches transfixed,
    her scientific curiosity battling terror as the sight exposes his sudden agony
    and inner corruption.
  purpose: ''
  significance: Exposes Dracula's vulnerability, fractures his godlike facade, and
