  global_id: null
  canonical_name: Kathleen's Television
  description: Kathleen's television sits in her kitchen/living area, screen displaying
    a cheap silent Western with a desert landscape and blazing sun. Dracula hunches
    before it, rapt and tearful at the sunlight's beauty, his fixation unbroken even
    as Kathleen discovers her folded husband in the fridge. The device embodies modern
    marvels that entrance the ancient vampire amid domestic horror.
  purpose: Displays moving images and sound from broadcast media, including Western
    films
  significance: Dracula's absorption in the sunlit scene exposes his longing for lost
    daylight and detachment from human suffering, contrasting his monstrous acts with
    childlike wonder at 21st-century technology
  potential_owner_mention: Kathleen
  potential_owner_uuid: agent_f82039762dfc
- fabula_uuid: object_19598eb8edca
  global_id: null
  canonical_name: Kathleen’s Bedroom Carpet
  description: Dracula’s feet, clad in shiny black shoes, step carefully across this
    floor covering in Kathleen’s bedroom. The carpet fills the domestic space, its
    ordinary texture grounding the scene as the vampire invades under broad daylight
    that soon fades. Kathleen stirs half-asleep nearby, mistaking him for her husband
    Bob, while the rug silently witnesses the predator’s advance and her dawning panic.
  purpose: Floor covering in a residential bedroom
  significance: Contrasts everyday home life with Dracula’s supernatural threat, heightening
    the violation as he exploits Kathleen’s vulnerability and trust.
  potential_owner_mention: Kathleen
  potential_owner_uuid: agent_f82039762dfc
- fabula_uuid: object_99132ee4c282
  global_id: null
  canonical_name: Kathleen’s Shabby Double Bed
  description: Located in Kathleen’s bedroom, this bed is a private space tied to
    Kathleen’s vulnerability and Bob’s implied absence. Its disheveled state and the
    empty side symbolize the disruption of domestic safety before Dracula’s intrusion.
  purpose: Sleeping and resting in a shared domestic space
  significance: Kathleen retreats to it in terror during Dracula’s infiltration, its
    disarray amplifying her vulnerability and marking the violation of her home as
    he exploits her confusion over Bob’s absence.
  potential_owner_mention: Kathleen
  potential_owner_uuid: agent_f82039762dfc
- fabula_uuid: object_bfda507a0e38
  global_id: null
  canonical_name: Lit Candle in Sister Agatha's Workshop
  description: A lit candle flickers in the dim confines of Sister Agatha's occult
    workshop, its flame casting unsteady light that brightens the semi-dark room as
    Zoe Helsing awakens disoriented. The glow illuminates arcane artifacts, dried
    herbs, and parchment, creating an eerie candlelit atmosphere during Agatha's revelations.
    Zoe stirs under its light while Agatha watches with a knowing smile.
  purpose: Provides ambient illumination in the dark workshop
  significance: Marks Zoe's return to consciousness as the first visual cue and symbolizes
