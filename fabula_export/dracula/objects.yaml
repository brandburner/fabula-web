  canonical_name: Lucy Westenra's Hand
  description: Dracula grasps Lucy Westenra's hand in the moonlit graveyard and presses
    it to the cold earth amid scattered graves. She hears the undead chorus below—fists
    pounding coffin lids, nails scraping wood, desperate pleas for light—culminating
    in a demonic child's eerie sing-song call of 'bloofer lady.' Lucy's fingers tense
    against the soil as the voices surge through her palm, her face registering shock
    at the supernatural transmission.
  purpose: Conduit to hear voices of the buried undead
  significance: Dracula deploys it to immerse Lucy in undeath's agony, stoking her
    dark curiosity and binding her to his world; her exposure warns against cremation's
