- fabula_uuid: object_8ca7d1faa947
  global_id: null
  canonical_name: Child's Grave Coffin
  description: 'Heavy wooden coffin (including its lid) exhumed by grave-robbers Gupta
    and Khan from a child''s grave in Dr. Sharma''s Calcutta lab. The coffin contains
    dual evidence of a cyclical vampire curse: (1) ancient, frantic scratches from
    a victim buried alive seventy years ago, and (2) fresh, unnatural gouges proving
    the occupant clawed free recently. Gupta and Khan pry the coffin open with tools,
    then lean the lid against the wall. Dr. Sharma examines both the coffin and its
    lid, tracing the scratches on the underside of the lid and the inscriptions on
    the coffin''s surface. The dual scars (on lid) and inscriptions (on coffin) shatter
    Sharma''s skepticism, confirming the vampire''s cyclical curse.'
  purpose: Seal the coffin shut for burial
  significance: Serves as forensic proof linking Dracula's ancient buried-alive victims
    to his recent undead escape, bridging the vampire's historical terror with the
    immediate threat aboard the Demeter. Transforms a burial relic into evidence of
    living horror, forcing Dr. Sharma to face the supernatural.
  potential_owner_mention: ''
  potential_owner_uuid: null
- fabula_uuid: object_512db48549a9
  global_id: null
