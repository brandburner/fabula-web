  global_id: null
  canonical_name: Lord Ruthven's Alcohol
  description: A **consumable liquid** (likely whiskey or brandy) that Lord Ruthven
    drinks in the passenger lounge to **numb his fear** and **resist Dracula’s psychological
    dominance**. Its effects—hollow laughter, drunkenness—are **visible to others**
    and contribute to the scene’s eerie atmosphere.
  purpose: Intoxicate to numb nervousness and cope with psychological pressure
  significance: Signals Lord Ruthven's crumbling resistance to Dracula's dark allure,
    marking his surrender and foreshadowing his transformation amid the escalating
