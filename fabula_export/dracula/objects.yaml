  global_id: null
  canonical_name: Dracula's Crypt Packing Cases (Victim Crates)
  description: 'Chaotic stacks of nailed-shut wooden packing cases filling Dracula''s
    castle crypt and storage rooms, some towering precariously like tombstones, others
    scattered amid damp stone. These cases serve dual purposes: (1) **Trophy Crates**
    containing personal effects of Dracula''s past victims (clothes, suitcases, books,
    photographs, spectacles) arranged in deliberate order, and (2) **Reanimation Chambers**
    housing reanimated corpses that plead for death when pried open. Jonathan Harker
    interacts with these cases in multiple locations—prying open crates in the storage
    room (revealing victim belongings) and later in the crypt (releasing the undead).
    The cases are secured with rusty nails and claw hammers, with some lids resting
    loosely (e.g., in the dining room behind Dracula) as psychological tools of torment.
    Narratively, they symbolize Dracula''s collection of victims, foreshadow Harker''s
    entombment, and expose the castle''s horrors during his confession to Sister Agatha.'
  purpose: Contain and conceal reanimated corpses
  significance: Harker's breach unleashes supernatural threats, confirming Dracula's
    necromancy and marking his shift from prisoner to intruder. Confession transforms
    them into communal warning, shifting nuns from pity to armed vigilance.
  potential_owner_mention: Count Dracula
  potential_owner_uuid: agent_a53a9c548239
- fabula_uuid: object_b898d61a63eb
  global_id: null
  canonical_name: Dracula's Decanter of Accountant's Blood
  description: Crystal decanter containing aged accountant's blood, used by Dracula
    in a **sensory ritual** to intimidate Lucy Westenra and her allies. Symbolizes
    his **predatory indulgence** and the **luxury of vampiric power**.
  purpose: Serving vintage blood for vampiric consumption
  significance: Anchors the romantic tableau Dracula crafts for Lucy, his favored
    bride, underscoring his predatory refinement until hunters shatter the illusion
    with news of her cremation
  potential_owner_mention: Dracula
  potential_owner_uuid: agent_a53a9c548239
- fabula_uuid: object_e5164aa82e01
  global_id: null
