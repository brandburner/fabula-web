  canonical_name: Dracula's Final Remaining Box of Earth (Demeter)
  description: A *physical box of native soil* critical to Dracula’s survival, distinct
    from the *footage* depicting its role in his revival. Exists in the Demeter’s
    flaming hold and is witnessed by the crew during the ship’s destruction.
  purpose: Supplies native earth required for vampire regeneration and rest
  significance: Heightens stakes as Dracula's last survival lifeline during ship destruction,
    exposing his vulnerability despite power
  potential_owner_mention: Dracula
  potential_owner_uuid: agent_a53a9c548239
