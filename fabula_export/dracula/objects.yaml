  description: Dragged by Dracula from its original position to directly face the
    television, this armchair becomes a symbol of his monstrous domesticity. Its use
    underscores the invasion of Kathleen’s home and the contrast between his relaxed
    posture and the horror unfolding around him (e.g., Bob’s body in the fridge).
  purpose: Seating pulled close to the television for viewing.
  significance: Dracula's use underscores his casual invasion of Kathleen's home,
    turning everyday furniture into a throne for his predatory idleness while Bob
    suffers nearby and Kathleen confronts the nightmare.
  potential_owner_mention: Kathleen
  potential_owner_uuid: agent_f82039762dfc
- fabula_uuid: object_009993b68e03
  global_id: null
  canonical_name: Kathleen's Bedroom Curtains
  description: Sunlight pours through the open curtains framing the window in Kathleen's
    modest bedroom. Dracula grabs the cord and yanks it, sliding the heavy fabric
    panels shut. Daylight vanishes, shadows swallow the room, and Kathleen recoils
    as the barrier falls, exposing her to his advance.
  purpose: Block sunlight from entering the bedroom
  significance: Dracula closes them to shatter the sun's protection, plunging the
    space into darkness and enabling his predatory dominance over Kathleen amid her
    dawning panic.
  potential_owner_mention: Kathleen
  potential_owner_uuid: agent_f82039762dfc
- fabula_uuid: object_378c6d1df988
  global_id: null
  canonical_name: Kathleen's Collapsing Wall Bricks
  description: Bricks break free and cascade to the ground as demolition machinery
    rips away the wall of Kathleen's house. They scatter amid dust and rubble, exposing
    the interior to harsh daylight that sears Dracula's skin. Dracula, Zoe Helsing,
    and Kathleen witness the collapse during their tense standoff, turning the home's
    destruction into a weaponized chaos.
  purpose: Form the exterior wall of Kathleen's house, providing structural enclosure
    until demolished.
  significance: Their fall floods the room with sunlight, burning Dracula and forcing
    his retreat into Zoe's trap, marking a tactical win in their power struggle.
  potential_owner_mention: Kathleen
  potential_owner_uuid: agent_f82039762dfc
- fabula_uuid: object_f48f72ea27fd
  global_id: null
  canonical_name: Kathleen's Cottage Entry Door
  description: The primary entry/exit door to Kathleen's cottage, which serves as
    a critical threshold in multiple supernatural encounters. In one scene, it stands
    open and unguarded amid the day's tension outside Kathleen's tragedy-struck home,
    framing Zoe Helsing's entry into the interior. In another pivotal moment, Kathleen
    yanks this door open, flooding the entryway with piercing daylight that strikes
    Dracula and forces him to recoil in agony from his vampiric weakness. The door's
    dual function as both a mundane entry point and a weaponized barrier against supernatural
    threats underscores its narrative significance in the episode's tension between
    domestic normalcy and horror.
  purpose: Provides passage from the exterior of Kathleen's cottage into its interior
  significance: Marks Zoe Helsing's decisive step into the cottage, launching her
    confrontation with its horrors and deepening her tie to the Van Helsing legacy
    amid clashing personal dread and duty
  potential_owner_mention: Kathleen
  potential_owner_uuid: agent_f82039762dfc
- fabula_uuid: object_c78fb165b79e
  global_id: null
  canonical_name: Kathleen's Cross Necklace
  description: Kathleen's cross necklace emerges into view around her neck as she
    panics and shuffles backward up the bed, away from Dracula in her sunlit bedroom.
    Dracula's eyes burn with frustration at the sight, its presence halting his advance
    and exposing its power as a vampire deterrent. She clutches at it instinctively
    amid the intrusion, the simple pendant gleaming faintly in the daylight before
    shadows claim the room.
  purpose: Repel vampires and protect the wearer from their influence
  significance: Frustrates Dracula's assault, reveals Kathleen's subconscious safeguard
    against supernatural threats, and hints at her deeper ties to vampire-hunting
    legacy amid the psychological invasion of her home.
  potential_owner_mention: Kathleen
  potential_owner_uuid: agent_f82039762dfc
- fabula_uuid: object_67b103fe28d1
  global_id: null
  canonical_name: Kathleen's Fridge
  description: Kitchen refrigerator in Kathleen's home, initially used as a makeshift
    prison to contain Bob's undead body after Dracula crams him inside. The fridge
    is violently yanked from the wall, its door bound shut with clothesline rope,
    and its contents scattered across the floor as Bob claws desperately from within.
    Dracula stabs Bob's protruding hand before slamming the door closed. Later, the
    fridge becomes unguarded, its door unsecured, as Zoe Helsing fixates on it from
    the threshold, drawn by its secrets amid the lingering tension between domestic
    normalcy and supernatural horror. The fridge serves as a haunting symbol of the
    intersection between Kathleen's grief and the supernatural threats plaguing the
    household.
  purpose: Food storage; repurposed as prison to contain Bob's undead body
  significance: Transforms domestic appliance into grotesque symbol of Dracula's cruelty,
    warping everyday life into horror and underscoring his dominance over death as
    Bob lingers in torment
  potential_owner_mention: Kathleen
  potential_owner_uuid: agent_f82039762dfc
- fabula_uuid: object_396b49ba8c68
  global_id: null
  canonical_name: Kathleen's House Mirror
  description: 'A household mirror fixed in Kathleen''s modern home captures Dracula''s
    gaze. Instead of his charming facade, it displays his true form: a dreadful, enfeebled
    ancient creature with grotesque features. Dracula recoils in horror, then smashes
    the glass with his fist, shards exploding outward as rage overtakes his denial.
    Kathleen watches from nearby, her question about reflections provoking the outburst.'
  purpose: Displays reflections for personal viewing
  significance: Exposes Dracula's hidden monstrous identity, ignites self-loathing,
    and prompts destructive fury, highlighting his vulnerability, fractured self-image,
    and clash with vampiric myth amid modern surroundings.
  potential_owner_mention: Kathleen
  potential_owner_uuid: agent_f82039762dfc
- fabula_uuid: object_33a63859bbbe
  global_id: null
  canonical_name: Kathleen's Kitchen Clothesline Rope (Fridge-Securing Ropes)
  description: A sturdy clothesline rope used by Dracula to bind Kathleen's fridge
    door shut, trapping Bob's folded body inside. The rope coils tightly around the
    fridge, resisting Bob's frantic clawing from within. Initially secured to contain
    Bob, the ropes are later found discarded and scattered across the floorboards
    of Kathleen's ruined house, surrounding the fridge that Dracula has dragged aside.
    Their frayed ends serve as a clue to Zoe Helsing, revealing Dracula's tampering
    and staging of Bob's living torment. The rope's purpose is to contain Bob and
    prevent his escape, serving as a grim symbol of Dracula's control over the household
    and the intersection of domestic horror and supernatural violence.
  purpose: Binds fridge door shut to restrain and secure Bob inside
  significance: Transforms everyday household rope into instrument of grotesque imprisonment,
    underscoring Dracula's casual inhumanity and the violation of domestic safety
    during the fridge revelation
  potential_owner_mention: Dracula
  potential_owner_uuid: agent_a53a9c548239
- fabula_uuid: object_46b33872a147
  global_id: null
  canonical_name: Kathleen's Kitchen Knife
  description: Kathleen grabs this knife from her kitchen counter and brandishes it
    at Dracula in a desperate bid to fight back, but he easily disarms her intent.
    He then drives the blade through the fridge door into Bob's clawing hand, silencing
    the undead scratching. Afterward, Dracula rinses it under the tap using a scrubbing
    brush, restoring its mundane cleanliness amid the gore.
  purpose: Weapon and tool for stabbing to silence undead threats
  significance: Kathleen wields it in futile human defiance against Dracula, who turns
    it into an instrument of casual cruelty, heightening the scene's domestic horror
    and underscoring his effortless dominance over life and resistance.
  potential_owner_mention: Kathleen
  potential_owner_uuid: agent_f82039762dfc
- fabula_uuid: object_5c06b63de5e2
  global_id: null
  canonical_name: Kathleen's Robe
  description: Kathleen snatches her robe from the bedside and pulls it around herself
    as she scrambles out of bed, her movements frantic after Dracula's cryptic taunt
    about her husband Bob. The garment provides hasty coverage over her nightclothes,
    her fingers clutching the fabric tightly while she confronts the intruder in her
    sunlit bedroom. Its soft drape contrasts the room's sudden menace, marking her
    shift from drowsy vulnerability to alarmed readiness.
  purpose: To cover her body and restore modesty during sudden intrusion
  significance: Kathleen grabs it instinctively to reclaim composure amid Dracula's
    psychological invasion, transforming a routine garment into a shield against exposure
    and amplifying the scene's tension of violated sanctuary.
  potential_owner_mention: Kathleen
  potential_owner_uuid: agent_f82039762dfc
- fabula_uuid: object_dde18d10f42e
  global_id: null
  canonical_name: Kathleen's Scrubbing Brush
  description: Dracula grabs the scrubbing brush from beside the kitchen sink in Kathleen's
    home and scrubs blood from his knife under running tap water. His deliberate strokes
    turn the cleanup of a fresh kill into a routine household task, blending vampiric
    brutality with modern domesticity as Kathleen watches in frozen horror.
  purpose: Scrubbing blood and grime from knives and dishes under running water
  significance: Dracula wields it to erase traces of violence through everyday chores,
    contrasting his ancient savagery with 21st-century normalcy and revealing his
    quick adaptation to mundane life amid predatory acts.
  potential_owner_mention: Kathleen
  potential_owner_uuid: agent_f82039762dfc
- fabula_uuid: object_954a18812395
  global_id: null
  canonical_name: Kathleen's Smartphone
  description: Owned by Kathleen and pivotal to her failed escape attempt during Dracula's
    home invasion, with Dracula observing the device with predatory curiosity.
  purpose: Receive incoming calls and transmit warnings
  significance: Ignites Kathleen's escape attempt and exposes Dracula to modern communication,
    blending his ancient instincts with 21st-century intrusion from the Harker Foundation
  potential_owner_mention: Kathleen
  potential_owner_uuid: agent_f82039762dfc
