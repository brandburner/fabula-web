  global_id: null
  canonical_name: Lucy Westenra's Bed
  description: Lucy Westenra's bed in her bedroom, where her pale, slack-jawed corpse
    leans motionless against the pillows. The bed's pillows prop her upright, staging
    a false serenity as flies cluster nearby amid the decay. The duvet drapes the
    bed, bunching as the demonic child's skeletal hands yank it from underneath, dragging
    it toward the floor to reveal the creature's hollow eyes. Dracula appears in the
    mirror to hush her screaming reflection, transforming the resting place into a
    site of eternal subjugation. The bed is also the site where Lucy grips the duvet
    in terror during the child's attack.
  purpose: Resting place
  significance: Contrasts rest with death; anchors revelation of Lucy's trapped soul
    and Dracula's dominion, extinguishing her agency as he declares her his thrall.
  potential_owner_mention: Lucy Westenra
  potential_owner_uuid: agent_6aa1fdfa8000
- fabula_uuid: object_32c7bce38b4c
  global_id: null
  canonical_name: Lucy Westenra's Bedside Clock
  description: Lucy Westenra glances at her bedside clock upon waking, its face glowing
    with 2:00 AM in the moonlit darkness of her bedroom. Positioned next to the bed,
    it anchors the late-night terror as the demonic child emerges and Dracula arrives
    outside the window. Lucy checks it again amid her panic, the time confirming the
    vulnerable hour of supernatural intrusion.
  purpose: Displays the current time to mark the late-night setting
  significance: Sets the eerie 2:00 AM context for Lucy's nightmare, heightening tension
    as demonic forces invade her bedroom sanctuary and Dracula begins her seduction
  potential_owner_mention: Lucy Westenra
  potential_owner_uuid: agent_6aa1fdfa8000
