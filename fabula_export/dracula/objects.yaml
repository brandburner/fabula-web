    Demeter, shielding his vampire eyes from sunlight as he navigates the wine cellar
    and deck. The lenses frame his face in a veneer of scholarly concern, enhancing
    his pose as a Byronic detective amid the crew's paranoia. Sister Agatha glares
    at him through their dim glow during their verbal spar, while Captain Sokolov
    and Abramoff witness his calculated emergence from shadows, spectacles perched
    as he declares a killer loose.
  purpose: Protect eyes from sunlight; aid deception as refined passenger
  significance: Reinforces Dracula's duality—daytime gentleman masking nocturnal predator—while
    amplifying his psychological control over the crew during the inquisition and
    search
  potential_owner_mention: Dracula
  potential_owner_uuid: agent_a53a9c548239
- fabula_uuid: object_73227b56aa27
  global_id: null
  canonical_name: Dracula's Coffin-Box
  description: "\n        Dracula's coffin-box is a macabre, reinforced container\
    \ used by Count Dracula to imprison and torment victims. Half-buried in the soil\
    \ of the Bridal Chamber, it features a glass panel and an unyielding hatch, allowing\
    \ trapped individuals (such as Jonathan Harker) to witness the horrors unfolding\
    \ outside—including the birth of a newborn vampire and the staked corpse of Elena.\
    \ The hatch resists all attempts to open it until Dracula forcibly releases the\
    \ victim, often with violent force (e.g., hurling Harker across the room into\
    \ Elena's corpse).\n        \n\n        **Contextual Expansion:** This coffin-box\
    \ is also referenced in earlier scenes as an 'imprisonment box' where Dracula\
    \ threatens Jonathan Harker with confinement should he attempt escape. The unseen\
    \ container evokes entombment, paralleling Dracula's own entrapment within the\
    \ castle's shadowed walls. The psychological torment of confinement is a recurring\
    \ theme, foreshadowing Jonathan's later entombment in the Bridal Chamber.\n  \
    \      \n\n        The coffin-box serves as both a prison and a tool of psychological\
    \ torment, designed to break the will of its occupants while forcing them to observe\
    \ the vampire's rituals. Its presence in the Bridal Chamber and the castle's highest\
    \ terrace underscores its dual role: a physical restraint and a symbolic extension\
    \ of Dracula's dominance over his victims."
  purpose: Prison to trap and torment victims like Jonathan Harker
  significance: Heights Harker's terror as he witnesses the vampire birth through
    the glass, fracturing his resistance and underscoring Dracula's cruel experimentation
    with mortality and monstrosity
  potential_owner_mention: Count Dracula
  potential_owner_uuid: agent_a53a9c548239
- fabula_uuid: object_8114ac50855e
  global_id: null
  canonical_name: Dracula's Coffin-Like Soil Boxes
  description: Fifty coffin-shaped wooden boxes loaded onto the Demeter, containing
    mouldering earth (or something worse). Winched onto the deck at dusk amid swarms
    of flies and a stench of decay, these boxes are central to the supernatural mystery.
    Olgaren questions their contents, dubbing them 'boxes of mould,' while Captain
    Sokolov dismisses this, claiming they hold only soil. Later, Dr. Sharma and others
    inspect fifty such boxes in the hold, confirming only dirt inside—though this
    is likely a red herring to mask Dracula's true coffin. The boxes serve as a narrative
    device to divert suspicion and foreshadow the plague aboard the ship.
  purpose: Transport soil across the sea
  significance: Crew unloads them amid rising dread, their flies and reek signaling
    supernatural peril ahead; they foreshadow vampiric horrors and doom the ship's
    voyage
  potential_owner_mention: ''
  potential_owner_uuid: agent_a53a9c548239
