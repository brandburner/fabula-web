  canonical_name: Convent's Sacred Protective Wards (Sanctum Barriers)
  description: An ethereal barrier of holy wards enveloping the Hungarian convent's
    sanctum, infused with sacred power amid incense-heavy air. These mystical protections—referred
    to as both the *Convent's Sacred Protective Wards* and *Sanctum's Ancient Wards*—repel
