  description: Symbolic glass bottle containing a miniature Demeter ship model, used
    by Dracula during a chess game to assert control over time and fate. Distinct
    from other glass objects in the episode (e.g., vials) by its decorative, non-functional
    role.
  purpose: ''
  significance: Dracula deploys it as a metaphor for his narrative control, trapping
    Agatha in his Demeter tale. It foreshadows the ship's doomed voyage through visual
