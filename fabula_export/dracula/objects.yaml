  canonical_name: Convent Cloister Stone Floor
  description: Cold stone floor of the convent's cloistered halls catches the Mother
    Superior's decapitated body as it crashes down, her blood spreading across it
    in a dark pool that foreshadows doom. Her severed head rolls over its unyielding
