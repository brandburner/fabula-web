  canonical_name: Lucy's Choker
  description: A decorative choker worn by Lucy Westenra to conceal the vampire bruise
    inflicted by Dracula. Serves as a symbolic threshold object, marking her surrender
    to his predation and the corruption of her innocence.
  purpose: Conceal vampire bite marks on Lucy's neck
  significance: Serves as a threshold object in Dracula's seduction of Lucy, removed
