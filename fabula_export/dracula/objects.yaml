  description: Dracula checks this incoming text message on his phone amid Frank Renfield's
    presentation of candidate profiles in his modern apartment. His gaze flickers
    to the screen, pulling his attention from the list. The distraction fuels his
    curt rejections—'No. I already have dinner plans'—as Frank presses for clarity
    on his desires. Content remains unseen, but it underscores the vampire's divided
    focus between loyalty and hunger.
  purpose: Deliver notification or communication prompting Dracula's 'dinner plans'
  significance: Serves as clue to Dracula's primal priorities, overriding Frank's
