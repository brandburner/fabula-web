  description: Sister Agatha arranges holy papers and wafers in a tight circle on
    the ship's deck under night skies. The survivors huddle inside this sacred boundary,
    which repels Dracula's approach with its holy power. Tension builds as Agatha
    tests Piotr by ordering him to step across the line; Adisa later defies it, breaking
    the circle's unity and inviting attack. The papers lie flat on weathered planks,
    edges forming the fragile barrier amid blood scent and waves.
  purpose: Block Dracula from reaching the group
