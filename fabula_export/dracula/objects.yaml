  canonical_name: Duchess Valeryia's 18th Birthday Pineapple (with Pink Tissue Paper
    Wrapping)
  description: Duchess Valeryia received this pineapple as a gift on her 18th birthday,
    wrapped in delicate pink tissue paper. The wrapping is a critical detail invoked
    by Dracula in Demeter's wine cellar to pierce her repressed trauma, proving his
    intimate knowledge of that night. Sister Agatha Van Helsing witnesses the exchange
    as the memory floods back, linking Dracula to Valeryia's mother's disappearance.
    The pineapple and its wrapping serve as a symbolic trigger for the Duchess's repressed
    trauma, revealing Dracula's presence at her birthday and his role in her family's
    tragedy.
  purpose: Birthday gift
  significance: Dracula wields the pineapple's memory as a psychological blade, forcing
    Duchess Valeryia to face his role in her past and her mother's disappearance.
    The detail shatters her denial, binds her terror to personal history, and elevates
    a simple fruit into proof of his predatory intimacy.
  potential_owner_mention: Duchess Valeryia
  potential_owner_uuid: agent_a062785f2df6
- fabula_uuid: object_f09b87acc135
  global_id: null
  canonical_name: Eerily Still Wolf
  description: A wolf stands motionless in the moonlit convent courtyard, its unnatural
    stillness piercing the night amid shrieking bats. Sister Agatha and Mother Superior
    observe it closely during their confrontation, the animal's eerie immobility amplifying
    the supernatural dread that grips the scene.
  purpose: ''
  significance: The wolf acts as an immediate omen of dark forces attacking the convent,
    its frozen pose clashing with the bats' frenzy to underscore vulnerability and
    foreshadow escalating threats amid the clash between Agatha’s knowledge and the
    Mother Superior’s dogma.
  potential_owner_mention: ''
  potential_owner_uuid: null
- fabula_uuid: object_5b3bb6af7c06
  global_id: null
  canonical_name: Elena's Warning Message
  description: Elena confesses she left this warning message at Jonathan Harker's
    window after tasting words from his letters to Mina. The message embodies her
    desperate bid to alert him amid the castle's horrors. Though its form goes undescribed,
    characters reference it directly during her revelation, just before Dracula slays
    her for the act.
  purpose: Warn Jonathan Harker of danger in Dracula's castle
  significance: Foreshadows the brides' eternal imprisonment and Elena's doomed rebellion
    against Dracula, connecting Harker's private letters to the supernatural threat
    and his impending transformation.
  potential_owner_mention: Elena
  potential_owner_uuid: agent_8c6161526ea6
- fabula_uuid: object_677ea9cefdf4
  global_id: null
  canonical_name: Father Stepashin's Ritual Stake
  description: Father Stepashin presses a wooden stake into the mother's trembling
    hands inside the sterile hospital ward. She places its sharpened point over her
    son Piotr's bloodied chest and drives it through his heart with three hammer blows
    amid spasms and writhing shadows. Doctor and nurse stand witness as the ritual
    unfolds. Survivors later wield similar stakes to pin Dracula against the Demeter's
    rum-soaked deck during a chaotic brawl.
  purpose: Drive through vampire hearts to prevent resurrection
  significance: Forces a grieving mother to execute her own son as an act of salvation
    from vampiric corruption, mirroring the escalating violence aboard the Demeter
    where survivors stake Dracula in desperate defiance, blurring love, mercy, and
    monstrosity.
  potential_owner_mention: Father Stepashin
  potential_owner_uuid: null
- fabula_uuid: object_7e2369f8f138
  global_id: null
  canonical_name: Fire in Castle Dracula's Dining Room Fireplace
  description: Roaring flames fill the fireplace in Castle Dracula's dining room,
    bathing the space in warmth and a flickering orange glow. Positioned behind Jonathan
    Harker, the fire casts long shadows across the room, obscuring Count Dracula's
    movements as he looms over his guest. Jonathan sits near it, exhausted, while
    the light plays across Dracula's transformed, youthful features during their tense
    exchange.
  purpose: Warms the dining room and provides dim illumination.
  significance: Heightens the scene's horror by creating shadows that conceal Dracula's
    predatory advance, amplifying Jonathan's shift from unease to terror amid the
    vampire's revelation.
  potential_owner_mention: Count Dracula
  potential_owner_uuid: agent_a53a9c548239
- fabula_uuid: object_03c5f90834a1
  global_id: null
  canonical_name: Fireside Rug in Dracula's Dining Room
  description: Jonathan Harker lies emaciated and nearly dead on this rug positioned
    directly in front of the fire in the dining room of Dracula's castle. The rug
    cushions his broken form as Count Dracula and Mina Murray stand nearby, its worn
    surface absorbing the scene's quiet horror and underscoring Jonathan's physical
    and mental collapse amid the flickering firelight.
  purpose: Floor covering positioned before the fireplace to provide a resting surface
  significance: Highlights Jonathan's vulnerability and descent into helplessness,
    serving as a stark backdrop to Dracula's psychological domination and the erasure
    of Jonathan's memories
  potential_owner_mention: Count Dracula
  potential_owner_uuid: agent_a53a9c548239
- fabula_uuid: object_654ff0b1c514
  global_id: null
  canonical_name: Fish That Triggers Dracula's Awakening
  description: Underwater footage captures this fish darting into the open mouth of
    Dracula's preserved body on the Demeter. The intrusion jolts him alive—eyes flare
    open, jaws clamp shut, severing Bloxham's thumb as the diver. Briefing room recruits
    gasp in shock and fascination; Bloxham reveals the thumb as hers, freezing the
    frame on the bloodied stump amid blood-type badges.
  purpose: Swims into Dracula's mouth to trigger his revival and jaw snap on intruder's
    thumb
  significance: Catalyzes Dracula's return in key footage, shocks recruits, mirrors
    costs of probing his resting place, and parallels Zoe's tense legacy as briefing
    erupts with Jack's arrival
  potential_owner_mention: ''
  potential_owner_uuid: null
- fabula_uuid: object_bb2e086710e0
  global_id: null
  canonical_name: Fisherman's Net
  description: Fishermen cast this coarse, salt-stiffened net into the waves and snagged
    Jonathan Harker, who drifted helpless after Dracula's ship hurled him overboard.
    The net hauled him to shore, securing his delivery to the convent for recovery.
    During Sister Agatha's tense interrogation, it surfaces as a key clue, its unlikely
    catch hinting at supernatural aid in his survival amid the vampire's pursuit.
  purpose: Catching and transporting Jonathan Harker from the sea following his escape
    from Dracula's ship
  significance: Acts as physical proof of unnatural intervention in Harker's rescue,
    fueling Sister Agatha's questions about the supernatural and deepening her crisis
    of faith
  potential_owner_mention: Fishermen
  potential_owner_uuid: agent_ea336c79c36c
- fabula_uuid: object_ad8aebcfc6c4
  global_id: null
  canonical_name: Flickering Candles (Castle Dracula & Hungarian Convent)
  description: Multiple candles light both Castle Dracula's dining room and the Hungarian
    convent's chambers, producing unsteady flames that cast sinister shadows. In Castle
    Dracula, their glow exposes Count Dracula's supernatural nature (e.g., feline
    gleam in his eyes) during Jonathan Harker's interrogation, while in the convent,
    they illuminate tense interrogations (e.g., Sister Agatha questioning Harker)
    and nuns' desperate standoffs. The candles amplify gothic dread, spiritual strain,
    and the narrative's foreboding tension, serving as a visual pivot between sanctuary
    and horror in key turning points.
  purpose: Illuminate dining room and convent chamber
  significance: Establish eerie ambiance and tension; mark turning points like Dracula's
    descent and Harker's confessions; symbolize fragile light against encroaching
    supernatural darkness
  potential_owner_mention: ''
  potential_owner_uuid: null
- fabula_uuid: object_d1fdb03cca47
  global_id: null
  canonical_name: Flies on the Coffin-like Crates
  description: Flies swarm across the dark wood surfaces of five coffin-like crates
    winched aboard the Demeter at dusk, their unnatural clustering and buzzing releasing
    a sinister stench amid the blood-orange sky. Adisa swats them away during boarding,
    but they persist, crawling over the crates as crew and passengers like Captain
    Sokolov, Olgaren, Lord Ruthven, and Dorabella react with growing unease to the
    ominous presence.
  purpose: ''
  significance: These flies signal supernatural corruption and impending doom on the
    Demeter, foreshadowing the plague that transforms the ship into a floating tomb.
    Their unnatural behavior heightens dread, linking the crates' cargo to Dracula's
    invasion and amplifying dramatic irony as the oblivious crew loads their own destruction.
  potential_owner_mention: ''
  potential_owner_uuid: null
- fabula_uuid: object_a91d110aa2f9
  global_id: null
  canonical_name: Foundation's Resealed Box Containing Dracula
  description: Bloxham's voiceover details this box, resealed by the Jonathan Harker
    Foundation to block interference during Dracula's revival. Foundation teams monitor
    it from the Whitby shore as a ten-hour countdown runs to his full awakening. Zoe
    Harker strides through sterile corridors, absorbing the narration's clinical account
    of the containment amid echoing footsteps and warning signs.
  purpose: Contain Dracula and prevent external interference during his revival process
  significance: Drives the ticking timeline to Dracula's return, exposes Foundation
    protocols' limits, and amplifies Zoe Harker's tension as legacy and mortality
    collide against ancient evil
  potential_owner_mention: Jonathan Harker Foundation
  potential_owner_uuid: null
- fabula_uuid: object_db9804abf17a
  global_id: null
  canonical_name: Framed Photograph Concealing Corpses in Castle Dracula’s Storage
    Room
  description: Unidentified framed photograph of a woman, placed atop a packing crate
    in Castle Dracula’s storage room. Its removal reveals a desiccated corpse, serving
    as a macabre plot device to escalate horror and trigger Jonathan Harker’s discovery
    of the undead.
  purpose: Conceal corpse in packing crate
  significance: Triggers discovery of hidden reanimated corpse, escalates Harker’s
    terror as undead emerge; acts as clue that propels his psychological descent into
    confronting Dracula’s supernatural domain.
  potential_owner_mention: ''
  potential_owner_uuid: null
- fabula_uuid: object_5350ff7bc3b7
  global_id: null
  canonical_name: Frank Renfield's Car
  description: Frank Renfield's car traps occupants in its cramped interior during
    a dusk drive through city streets. Dracula leans forward as Jack Seward's phone
    displays Lucy Westenra's provocative photo, his gaze locking on her image amid
    Frank's mentions of the Jonathan Harker Foundation. The confined space heightens
    tension during Dracula's first verbal claim on Lucy. Later, at night outside a
    graveyard, Frank hunches inside alone, absently eating a fly while scrawling 'DRACULA
    IS MY LORD' across a crossword puzzle.
  purpose: Transports Frank Renfield and passengers while providing a private space
    for tense conversations and solitary rituals
  significance: Amplifies claustrophobic intimacy that mirrors Dracula's narrowing
    obsessions with Lucy Westenra and the Jonathan Harker Foundation; site of predatory
    fixation, institutional revelations, and Frank's fanatical devotion, foreshadowing
    cult-like madness and inescapable fates
  potential_owner_mention: Frank Renfield
  potential_owner_uuid: agent_05618ea8e881
- fabula_uuid: object_91924b042737
  global_id: null
  canonical_name: Frank Renfield's Crossword Puzzle
  description: A crossword puzzle deliberately chosen and defaced by Frank Renfield,
    serving as a metaphor for his intellectual unraveling and fanatical devotion to
    Dracula. Unlike the fly, this object is a lasting possession of Frank’s and is
    not consumed or transformed.
  purpose: Solving crossword clues
  significance: Frank treats the puzzle as a sacred rite merging intellectual challenge
    with fanatical worship of Dracula, foreshadowing the cult's dehumanizing loyalty.
    Its defacement reveals his regression into primal madness.
  potential_owner_mention: Frank Renfield
  potential_owner_uuid: agent_05618ea8e881
- fabula_uuid: object_6e2eeba33599
  global_id: null
  canonical_name: Frank Renfield's Laptop
  description: A **technological device** owned by Frank Renfield, used for a **Skype
    call with Dracula** in Dracula’s apartment. Its closure is triggered by an **external
    distraction (a fly)** and a **doorbell ring**, marking critical narrative beats.
  purpose: Video communication via Skype
  significance: Exposes Renfield's suicidal plea and the hunters' interruption of
    Dracula's ritual reunion with Lucy, underscoring Dracula's detachment and the
    chaotic collision of mortal desperation with vampiric ritual. The abrupt closure
    punctuates the shift from intimate communication to violent confrontation.
  potential_owner_mention: Frank Renfield
  potential_owner_uuid: agent_05618ea8e881
- fabula_uuid: object_7de65650d5a8
  global_id: null
  canonical_name: Glass Ceiling Mechanism in Dracula’s Containment Unit
  description: The *physical mechanism* (output system) of Dracula’s containment unit,
    consisting of mechanized glass panels that admit sunlight when activated by the
    wall-mounted control pad. This system is the direct cause of Dracula’s immobilization
    and pain, serving as a weaponized solar trap.
  purpose: Opens ceiling panels to flood the containment unit with sunlight, weaponizing
    it against vampires
  significance: Zoe wields it to dominate Dracula physically and psychologically,
    compelling ritual bloodletting and exposing mutual obsessions with mortality and
    control amid the Foundation’s hypocritical legacy
  potential_owner_mention: Zoe Helsing
  potential_owner_uuid: null
- fabula_uuid: object_ed523cad6165
  global_id: null
  canonical_name: Glass Tunnel System (Bridal Chamber and Coffin-Box Connection)
  description: A complex glass tunnel system integrated into Dracula's Bridal Chamber
    and coffin-box, serving as a transparent pathway for insects, rodents, and newborn
    vampires. The system connects glass spheres teeming with flies and rats to the
    interiors of the Bridal Chamber, where reanimated corpses and vampire brides feed
    on the trapped creatures. It also links the coffin-box directly to the Bridal
    Chamber, allowing the newborn vampire to crawl toward trapped victims like Jonathan
    Harker. The transparent design amplifies horror by revealing predatory movements
    and the grotesque feeding habits of Dracula's undead brides, while also serving
    as an observation point for Harker's terror. Additionally, the glass panel in
    the coffin allows Harker to observe the Bridal Chamber's horrors from inside the
    confined space, intensifying his psychological descent.
  purpose: Feeds vampiric brides by channeling live flies and rats from glass spheres
    into the packing cases for consumption.
  significance: Exposes the brides' grotesque feeding habits, heightens the chamber's
    nightmarish atmosphere, and shatters Jonathan Harker's illusions of control amid
    his confrontation with Elena.
  potential_owner_mention: Count Dracula
  potential_owner_uuid: agent_a53a9c548239
- fabula_uuid: object_2b2c836dbe66
  global_id: null
  canonical_name: Glutinous Blood Stain on Demeter Deck (Dorabella’s Vanishing Site)
  description: A thick, sticky blood smear on the deck planks where Dorabella disappeared,
    used by Dracula to manipulate the crew into paranoia and accusations. This entity
    is distinct from other blood manifestations aboard the Demeter.
  purpose: ''
  significance: This bloodstain acts as a crucial clue fracturing crew trust, prompting
    Dracula to redirect suspicion onto imagined threats and ignite a shipwide hunt
    that masks his predation.
  potential_owner_mention: ''
  potential_owner_uuid: null
- fabula_uuid: object_221480e751f0
  global_id: null
  canonical_name: Grand Doors to the Crypt
  description: Massive doors frame the entrance to Castle Dracula's crypt, their grand
    scale imposing a formal threshold amid damp stone walls. Jonathan Harker grips
    his oil lamp tightly as he pushes through them into a labyrinth of towering packing
    cases that resemble tombstones under flickering light. The doors seal a space
    thick with an unnatural scent, marking Harker's passage into buried horrors.
  purpose: Provide entry to the crypt storage room
  significance: Crossing these doors shifts Harker from passive imprisonment to active
    confrontation with Dracula's secrets, turning the crypt into a harbinger of supernatural
    corruption and a physical manifestation of the Count's predatory domain.
  potential_owner_mention: Count Dracula
  potential_owner_uuid: agent_a53a9c548239
- fabula_uuid: object_84634bd61cd9
  global_id: null
  canonical_name: Grand Duchess Valeryia's Lorgnette Spectacles
  description: Handle-mounted eyewear accessory actively used by Grand Duchess Valeryia
    in the Demeter’s dining room to examine objects, framing her aristocratic demeanor
    and vulnerability. Distinct from other jewelry or props associated with her.
  purpose: Reading aid for inspecting fine print like menus at close range
  significance: Emphasizes Valeryia's aristocratic status and fragile dignity, marking
    her as Dracula's initial target in the ship's escalating horror
  potential_owner_mention: Grand Duchess Valeryia
  potential_owner_uuid: null
- fabula_uuid: object_f1bbb3a9a603
  global_id: null
  canonical_name: Grand Duchess Valeryia’s Stolen Diamond Ring
  description: A **jewelry prop** used as staged evidence in Agatha’s trial, displayed
    in Demeter’s wine cellar to inflame the crew’s paranoia. Distinct from the Grand
    Duchess’s clothing items.
  purpose: Personal jewelry; false evidence in Agatha’s murder trial
  significance: Dracula’s key trophy frames Agatha as the killer, fractures crew trust,
    and propels the wine cellar confrontation toward deckside lynching chaos before
    his own bloodlust erupts.
  potential_owner_mention: Grand Duchess
  potential_owner_uuid: null
- fabula_uuid: object_03d87d350a13
  global_id: null
  canonical_name: Grand Duchess's Black Bombazine Dress
  description: A **garment** worn by the Grand Duchess during her murder, symbolizing
    her brutal demise. Distinct from her jewelry or other personal items.
  purpose: Formal dress worn by the Grand Duchess
  significance: Serves as a symbolic prop of victimhood, its bloodstains underscoring
    the savagery of Dracula's predation and the passengers' growing horror amid the
    ship's chaos.
  potential_owner_mention: Grand Duchess
  potential_owner_uuid: null
- fabula_uuid: object_98fc6b79c856
  global_id: null
  canonical_name: Graveyard Gate Adjacent Bushes
  description: Dense, tangled vegetative obstruction near the graveyard gate, distinct
    from the gate itself; serves as a visual barrier that fragments Zev's view of
    Lucy and Dracula, amplifying the chase's urgency through atmospheric tension.
  purpose: Obstruct Zev's view during his run to the gate
  significance: Intensify tension and suspense as Zev discovers Lucy's corruption,
    transforming the graveyard chase into a visceral reveal of supernatural horror
  potential_owner_mention: ''
  potential_owner_uuid: null
- fabula_uuid: object_d0580e59ce07
  global_id: null
  canonical_name: Graveyard Ground (Tactile Supernatural Threshold)
  description: The physical graveyard earth where Dracula presses Lucy Westenra's
    hand, triggering the emergence of undead voices and spectral forms. Acts as a
    conduit between the living and the dead, marking Lucy's ritualistic descent into
    fascination with the supernatural.
  purpose: Conduit for the undead's tormented voices to reach the living
  significance: Exposes the agony of vampiric undeath and Dracula's fear of cremation,
    while igniting Lucy's morbid thrill and foreshadowing her corruption as his perfect
    prey
  potential_owner_mention: ''
  potential_owner_uuid: null
- fabula_uuid: object_1f6bfd54b258
  global_id: null
  canonical_name: Graveyard Iron Gate
  description: Rusted iron gate with railings at the graveyard entrance, physically
    interacted with by Zev to breach the threshold between the liminal zone and the
    confrontation with Lucy; symbolizes the barrier between life and death, and Zev's
    desperate intrusion into Lucy's corruption.
  purpose: Provide entry to the graveyard
  significance: Zev shoves it open to witness Lucy's grotesque intimacy with Dracula,
    transforming the graveyard from mourning ground to site of her supernatural corruption
    and violent rejection of Zev.
  potential_owner_mention: ''
  potential_owner_uuid: null
- fabula_uuid: object_c4b49eb11558
  global_id: null
  canonical_name: Graveyard Railings
  description: Physical wrought-iron barrier surrounding the graveyard, serving as
    a visual obstacle for Zev. Distinct from supernatural elements like shadows or
    undead voices.
  purpose: Barrier enclosing graveyard sections and obstructing sightlines between
    areas
  significance: Partially conceals Lucy's corruption by Dracula from Zev, building
    tension and shattering his perception of her as the intimate scene flickers through
    bars, pivoting concern to visceral horror
  potential_owner_mention: ''
  potential_owner_uuid: null
- fabula_uuid: object_1ef04f88afb7
  global_id: null
  canonical_name: Graveyard Shadows (Lurking Supernatural Medium)
  description: Supernatural, sentient shadows with agency in the graveyard, merging
    with the demonic child and amplifying undead voices. Distinct from physical graveyard
    structures like railings or gates.
  purpose: ''
  significance: Shadows conceal the demonic child and embody the unseen supernatural
    threat, drawing Lucy deeper into Dracula's world while underscoring his control
    over the undead chorus rising from the earth.
  potential_owner_mention: ''
  potential_owner_uuid: null
- fabula_uuid: object_9d850311b7fa
  global_id: null
  canonical_name: Graveyard Streetlights (Sickly Orange Glow)
  description: Streetlights in the moonlit graveyard cast a sickly orange glow that
    bathes Lucy straddling Dracula, her posture intimate yet grotesque. Zev glimpses
    the scene through railings during his frantic search, the unnatural light amplifying
    the supernatural horror as the figure vanishes, leaving Lucy sprawled on a bench.
    Tombstones loom in the eerie illumination, turning the sanctuary into a stage
    of corruption.
  purpose: Illuminates the graveyard at night, highlighting Lucy and Dracula's interaction
  significance: Emphasizes the grotesque supernatural corruption of Lucy, marking
    Zev's shift from concern to terror as he confronts her feral rejection
  potential_owner_mention: ''
  potential_owner_uuid: null
- fabula_uuid: object_21c2fb2dc1ab
  global_id: null
  canonical_name: Guards' Hard Hats
  description: Yellow plastic hard hats perch on the heads of guards encircling Zoe
    Helsing outside Kathleen's ruined cottage. They shield against falling debris
    and hazards during operational tasks like digging through wreckage or clearing
    Dracula's aftermath. The shells catch daylight amid the site's tension, marking
    military caution as Zoe weighs entry into the deadly interior.
  purpose: Protect heads from injury during hazardous cleanup and digging operations
  significance: Embody the military's grounded safety protocols amid supernatural
    devastation, underscoring human fragility and institutional response as Zoe confronts
    her Helsing legacy at the cottage threshold
  potential_owner_mention: The Commander
  potential_owner_uuid: null
- fabula_uuid: object_a40e0bbf7ef2
  global_id: null
  canonical_name: Hallway Table in Dracula's Castle
  description: A table positioned in the hallway of Dracula's castle main hall holds
    a carpet bag whose contents writhe and emit infant cries. Count Dracula casually
    lifts the bag from its surface amid the suffocating opulence, ignoring Jonathan
    Harker's horrified plea. The table anchors the grotesque revelation of the vampire's
    predation.
  purpose: Surface for holding and accessing items like the wriggling carpet bag
  significance: Heights the scene's horror as Dracula retrieves the bag, underscoring
    Jonathan's psychological collapse and the Count's casual monstrosity
  potential_owner_mention: Count Dracula
  potential_owner_uuid: agent_a53a9c548239
- fabula_uuid: object_2acd9b315e30
  global_id: null
  canonical_name: Harker Foundation Corridor Flip-Clock (Mounted Below 'NO UNAUTHORIZED
    ACCESS' Sign)
  description: A standalone mechanical timekeeping device mounted below the 'NO UNAUTHORIZED
    ACCESS' sign in the Jonathan Harker Foundation corridor, displaying sunrise (06:45)
    and sunset (07:12) with audible ticking. Its countdown underscores the Foundation's
    reliance on daylight for containing Dracula, distinct from the sign it is mounted
    beneath.
  purpose: Displays precise sunrise and sunset times to track daylight for vampire
    containment protocols
  significance: Amplifies the Foundation's desperation against Dracula's nocturnal
    power, its countdown paralleling Jack Seward's psychological strain and the shared
    'abstinence' with the vampire
  potential_owner_mention: Jonathan Harker Foundation
  potential_owner_uuid: null
- fabula_uuid: object_eccd80ae3666
  global_id: null
  canonical_name: Harker Foundation High-Security Casket (Modern Vampire Trap)
  description: A reinforced, high-tech casket designed by the Harker Foundation as
    a trap for Dracula, featuring modern surveillance grills, a stenciled 'DRACULA'
    label, and an interior packed with soil and a ringing phone for remote monitoring.
    Discovered in Kathleen's house during Episode 3 ('The Dark Compass'), it interrupts
    Dracula's exploration and is part of a contemporary security system targeting
    him.
  purpose: Contain and weaken Dracula through soil deprivation and surveillance
  significance: Exposes Harker Foundation's proactive hunt for Dracula, blending 21st-century
    technology with vampiric lore to challenge his supremacy and force confrontation
    with human adversaries
  potential_owner_mention: Harker Foundation
  potential_owner_uuid: agent_5a6725cbe219
- fabula_uuid: object_90882a2d9f5c
  global_id: null
  canonical_name: Harker Foundation’s Wealth
  description: Sister Agatha confronts Zoe Helsing in her hospital ward, exposing
    the Harker Foundation’s wealth as tainted money Zoe channeled into philanthropy.
    This funding traces back to the same dark forces that resurrected Dracula, striking
    Zoe amid her terminal illness and psychic turmoil. Her face twists in horror as
    the revelation lands, linking her good intentions to vampiric evil through ancestral
    complicity.
  purpose: Fund Zoe Helsing's philanthropic work
  significance: Exposes Zoe's unwitting role in Dracula's return, shattering her moral
    certainty and forging a blood-bound alliance with Agatha's spirit against the
    vampire threat
  potential_owner_mention: Zoe Helsing
  potential_owner_uuid: null
- fabula_uuid: object_39e0dc41363e
  global_id: null
  canonical_name: Harker's Shattered Crate Lids
  description: Wooden lids from storage crates litter the floor in jagged, splintered
    pieces, nails twisted from forceful prying, surfaces stained with blood from Jonathan
    Harker's splinter-torn fingers. Harker tore them apart in earlier frenzied searches,
    leaving wreckage that scatters amid emptied box contents, visible signs of his
    raw, animalistic desperation amid the room's gloom.
  purpose: Seal wooden crates for storage
  significance: Mark Jonathan Harker's psychological breakdown and repeated failed
    attempts at escape, their destruction underscoring his shift from methodical solicitor
    to terror-driven survivor clawing for control.
  potential_owner_mention: Jonathan Harker
  potential_owner_uuid: agent_e0c9af46ae1c
- fabula_uuid: object_cf3f3e6547ab
  global_id: null
  canonical_name: Harker's Uneaten Mound of Meat
  description: A large, untouched mound of meat occupies Jonathan Harker's plate in
    Castle Dracula's dining room. Harker struggles to eat it, poking at the pile hesitantly
    while seated with Count Dracula and a Transylvanian girl. Dracula gestures toward
    it during his lecture, emphasizing respect for slaughter and the need to thicken
    the blood.
  purpose: Meal for Jonathan Harker
  significance: Dracula wields the meat as a symbolic tool to assert dominance, linking
    it to predatory themes of consumption and threat, which erode Harker's autonomy
    during the dinner conversation.
  potential_owner_mention: Count Dracula
  potential_owner_uuid: agent_a53a9c548239
- fabula_uuid: object_a2a53e8a2e17
  global_id: null
  canonical_name: Hidden Brick-Wall Secret Passage Door
  description: A camouflaged door disguised as part of the castle's brick wall, requiring
    deliberate discovery to reveal a narrow spiral staircase plunging deeper into
    the fortress. Its flawless masonry disguise is part of the castle's maze-like
    trap, designed to disorient explorers and force active engagement with its secrets.
