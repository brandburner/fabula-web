    missing servants and driver. The yellowed pages and formal script outline the
    estate's purchase and Harker's obligations, serving as the official record of
    the transaction. Their presence underscores both Harker's professional role and
    the Count's calculated detachment and growing control over the solicitor's visit.
    The papers symbolize Dracula's control and the legal pretext for Harker's captivity.
