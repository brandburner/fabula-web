    (e.g., Dracula's wine glass, Mina's photo) and is a focal point for character
    interactions (Jonathan's proximity, Dracula's placement of items).
  purpose: Holds glasses and small items during meals or conversations
  significance: Anchors the scene's deceptive normalcy; the wine glass atop it symbolizes
