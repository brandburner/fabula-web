    Soil, Charcoal'
  description: Captain Sokolov recites this cargo manifest—saltpetre, children’s dolls,
    sulphur, soil, charcoal—to first mate Olgaren amid the Demeter's cluttered docks
    at dusk. The list aims to explain the coffin-like crates buzzing with flies, but
    the suspicious soil and mould inside those boxes clash with these mundane goods,
    drawing wary glances from Lord Ruthven, Lady Dorabella, Adisa, and the crew.
  purpose: Ship's cargo for transport aboard the Demeter
  significance: Exposes deception as Sokolov downplays the eerie coffin-like crates;
    the mismatch fuels crew unease and foreshadows supernatural doom on the voyage
