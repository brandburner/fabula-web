  description: A medical gurney strapped to a dark coffin, used to transport Dracula
    from his burial chamber. Features a side grill for ventilation and squeaking wheels
    that amplify the jarring motion during movement. Distinct from other coffins in
    the series by its mobility and clinical association.
  purpose: Contain and transport Dracula securely during daylight transit
  significance: Dracula's prison exposes his physical betrayal and temporal disorientation,
    confronts him with Jonathan Harker's legacy through the portrait, and ignites
    tension with Bloxham and the Commander, foreshadowing clashes with modern foes
