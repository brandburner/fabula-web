    in horror.
  purpose: Forms the walking surface of the convent's cloistered halls, bearing the
    weight of inhabitants and fallen bodies during the invasion.
  significance: 'Serves as the grim canvas for Dracula''s desecration: blood pooling
    signals the breach of holy wards, the rolling head underscores sacrilegious horror,
    and it marks the convent''s fall from sanctuary to slaughterhouse, heightening
    emotional stakes for Mina and Jonathan.'
