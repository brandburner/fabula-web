  global_id: null
  canonical_name: Map of Dracula’s Castle
  description: Hidden map charting the layout of Count Dracula’s castle, uncovered
    through Jonathan Harker’s insight into Dracula’s boast that no map existed there.
    Jonathan presses the clue during tense exchange in his convent room, silencing
    Sister Agatha’s doubts as the group grasps its potential for escape or assault.
    The Silent Nun (Mina) observes amid rising strategic tension.
  purpose: Guides navigation and reveals tactical paths within Dracula’s castle
  significance: Transforms Jonathan’s trauma-induced slowness into vital weapon against
