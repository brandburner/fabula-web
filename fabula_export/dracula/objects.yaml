    from prior use—underscores the crew's fraying struggle against unseen horrors
    and the ship's deteriorating conditions. Its role shifts between functional dining
    space and a site of brutal, life-saving (or life-ending) interventions, reflecting
    the crew's desperation and the supernatural dread permeating the Demeter.
  purpose: Improvised surgical surface for resetting broken bones
