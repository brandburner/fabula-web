    room to prove Count Dracula's legal entry as a refugee. He wields them against
    Zoe Helsing's accusations, emphasizing meticulous filing that grants Dracula protected
    status. Bloxham stays silent under Frank's pressure, while Dracula watches via
    monitor. The paperwork exposes legal shields around the vampire, blocking Helsing
    Foundation action.
  purpose: Establishing Dracula's legal immigration and refugee status to counter
    claims of illegality
  significance: Frank deploys the documents to dismantle Zoe Helsing's authority,
