  canonical_name: Cheap Western TV Show
  description: A low-budget Western program airs on the kitchen television, displaying
    a stark desert landscape beneath a blazing sun. Dracula stares at the screen in
    rapt fascination, tears tracing his cheeks as he murmurs its beauty. This grips
    him amid Kathleen's horror at discovering Bob's folded corpse in the fridge, her
    futile knife grab, and his casual dismissal of the violence.
  purpose: Broadcasts Western adventure content featuring desert scenes and intense
    sunlight for viewer entertainment.
  significance: Distracts Dracula from the unfolding domestic atrocity, his emotional
