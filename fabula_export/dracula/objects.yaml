  potential_owner_mention: Lucy Westenra
  potential_owner_uuid: agent_6aa1fdfa8000
- fabula_uuid: object_d5f4dfd32b19
  global_id: null
  canonical_name: Lucy Westenra’s Slightly Open Bedroom Window
  description: Dracula materializes outside this slightly open window in Lucy Westenra’s
    bedroom, using it as entry point while moonlight streams inside. Lucy earlier
    shows irritation at its openness. He lounges on the sill at an impossible angle
    after staking the demonic child, then leans near it to brush her choker and bite
    her neck.
  purpose: Admits moonlight into the bedroom and provides external access for Dracula.
  significance: 'Signals Lucy’s vulnerability: symbolic entry for demonic child, literal
