    episodes:
    - fabula_uuid: ep_sea_ser_dracula_s01_e01
      episode_number: 1
      title: The Rules of the Beast
      logline: In 1897 Hungary, Jonathan Harker's terrifying experiences at Count
        Dracula's castle lead Sister Agatha and Harker's fiancée Mina to confront
        the ancient vampire, whose thirst for blood and power threatens to consume
        England.
      high_level_summary: "In 1897 Hungary, Jonathan Harker seeks refuge in a convent\
        \ after a harrowing experience with Count Dracula in Transylvania. Sister\
        \ Agatha, a shrewd nun with a mysterious past, studies Jonathan's account\
        \ of his encounter, sensing a deeper, more sinister truth. Through flashbacks,\
        \ the screenplay reveals Jonathan's journey to Dracula's castle to finalize\
        \ a property transaction, where he is met with eerie omens and unsettling\
        \ encounters. A local girl warns him to \"Keep Away\" from Dracula and gifts\
        \ him a cross, a symbol that is later dismissed by Sister Agatha. Jonathan's\
        \ arrival at the castle is marked by a near-death carriage ride and an unsettling\
        \ encounter with a swarm of bats, leading him to believe that the castle itself\
        \ is alive. \n\nInside, Dracula, initially appearing as a frail, pale old\
        \ man, expresses his desire to learn about English culture and language, and\
        \ invites him to stay as long as needed. As days turn into nights, Jonathan's\
        \ health deteriorates while Dracula grows younger and stronger. Jonathan discovers\
        \ buried corpses in packing crates stored in a hidden chamber, adding to his\
        \ terror. He tries to find help by leaving messages at the window and attempting\
        \ to seek information about the castle, but quickly realizes there is no use.\
        \ One morning, after experiencing disturbing dreams of Mina and Dracula, Jonathan\
        \ awakens to find that Dracula has been feeding on him. \n\nJonathan's attempts\
        \ to escape the castle are thwarted by Dracula, who reveals his plans to go\
        \ to England, and Mina who, during all of this is trying to reach Jonathan.\
        \ The vampire forces Harker to write letters to his fiancee attesting to his\
        \ safety while planning Harker's demise. A vision of the count carrying a\
        \ baby in a carpet bag reveals Dracula's depravity and intentions. Jonathan\
        \ is eventually killed by Dracula, who then plans to use one of the crates\
        \ Jonathan discovered to carry Dracula to England, but his ordeal does not\
        \ end there. It is then that he is forced with a decision, to let Dracula\
        \ travel to England and potentially infect Mina, whom he has all the more\
        \ lost affection for, or allow her to die. Although initially choosing the\
        \ latter, a new path is shown to Jonathan that shows there are still some\
        \ that can be saved. Upon finding this new resolve, Dracula snaps his neck.\
        \ However, instead of dying completely, he revives as undead, setting the\
        \ stage for a climactic confrontation.   Dracula can only be stopped by God\
        \ himself. \n\nBack in the convent, Sister Agatha reveals that Jonathan did\
        \ indeed write the account he originally wrote, but Dracula quickly persuaded\
        \ Jonathan to do his bidding. As a result, he must be put down immediately.\
        \ The story culminates with Dracula's arrival at the convent, seeking Jonathan.\
        \ Dracula mocks the nuns, but Sister Agatha, using a knife and crucifix, establishes\
        \ that he cannot enter unless invited.  Dracula, after tasting Sister Agatha's\
        \ blood admits her intelligence and says she will be the last person he feasts\
        \ on. Sister Agatha and Mina are quick to come up with an escape plan. Finally,\
        \ as Mina tearfully is ready to take the plunge and take out the stake that\
        \ would end him again. \n\nWith the help of her colleagues, Dracula manages\
        \ to enter the abbey. It ends with Harker's and Dracula's reunion where Harker\
        \ turns into a full fledged vampire after succumbing to her seduction. With\
        \ the townspeople ready to take down Dracula once at for all.  "
      dominant_tone: Tragic
      raw_credits_block: ''
      has_complete_credits: false
    - fabula_uuid: ep_sea_ser_dracula_s01_e02
      episode_number: 2
      title: Blood Vessel
      logline: Count Dracula's journey aboard the Demeter to England becomes a bloodbath
        as he preys on the crew and passengers, forcing a nun and the ship's captain
        to make a desperate stand to stop him before he reaches land.
      high_level_summary: "In a Transylvanian wine cellar, Dracula converses with\
        \ Sister Agatha about stories and a game in progress. He recalls his voyage\
        \ to England aboard the Demeter. The Demeter sets sail carrying passengers\
        \ like Lord Ruthven and his wife Dorabella, Dr. Sharma and his daughter Yamini\
        \ along with crew like Captain Sokolov and Olgaren.\n\nAs the Demeter is sailing\
        \ the crew experiences nightmares of severed hands and a dark figure. Dr.\
        \ Sharma is revealed to have a scar from a previous encounter with the supernatural.\
        \ Strange occurrences begin when a coffin-like box is loaded onto the ship\
        \ including dead seagulls littering the deck. Portmann vanishes one night\
        \ with Dracula nearby, arousing suspicion. Dorabella, Lord Ruthven’s wife\
        \ is smitten with Abramoff and is later found to have been seduced by Dracula.\n\
        \nAs a storm rages and the Demeter is lost the Grand Duchess is murdered by\
        \ Dracula. Now the passengers turn on each other to try to find the killer\
        \ amongst them. Yamini witnesses Dracula preying on Dorabella's bloodied corpse\
        \ and eventually Abramoff is found dead from the vampire’s hunger. During\
        \ these events suspicion arises on the passengers, including Agatha who is\
        \ eventually proven to be the vampire, later revealed to be a false lead.\
        \ Agatha is strung up in a noose for her crimes, but Dracula intervenes, instead\
        \ revealing himself as the true vampire. During a brawl aboard the deck of\
        \ the ship Adisa the servant is killed and Dracula is caught in a fire forcing\
        \ him to flee to sea. \n\nBelieving the evil to have been defeated Agatha\
        \ reveals herself as Sister Van Helsing, determined to sink the ship to not\
        \ unleash the evil on England. Now at the shore, close to England, Van Helsing\
        \ and Sokolov prepare the ship for self-destruction. Eventually, with no other\
        \ choice Sokolov relents as Agatha prepares the ship for destruction. However,\
        \ Dracula returns forcing Agatha to sacrifice herself to sink the ship, though\
        \ it ultimately is believed that he is killed from the self-destruction of\
        \ the ship.\n\nDracula however reappears on the shores of England when he\
        \ is greeted by a woman who bears a striking resemblance to Agatha who seemingly\
        \ knows of his arrival."
      dominant_tone: Tragic
      raw_credits_block: ''
      has_complete_credits: false
    - fabula_uuid: ep_sea_ser_dracula_s01_e03
      episode_number: 3
      title: The Dark Compass
      logline: Awakened in the 21st century, Dracula faces a descendant of Van Helsing,
        Zoe, who is determined to understand and defeat him, even as her own mortality
        and a mysterious connection to Lucy Westenra complicate her mission.
      high_level_summary: "Episode 3 opens with Dracula revealed within Jonathan Harker,\
        \ confronting Mina and Sister Agatha. Agatha sacrifices herself, allowing\
        \ Mina to escape with a notebook, while Dracula consumes Agatha, vowing to\
        \ carry her to the New World within him. \n\nIn present-day Whitby, Dracula\
        \ emerges, disoriented, onto a beach where Zoe Helsing and armed forces await.\
        \ He learns he’s been submerged for 123 years. Zoe, a scientist connected\
        \ to Agatha’s bloodline, attempts to understand him. Dracula, fascinated by\
        \ modern technology, quickly assesses Zoe's bloodline connection to Agatha.\
        \ He toys with the soldiers, demonstrating his speed and disregard for modern\
        \ weapons. \n\nMeanwhile, in Whitby, Kathleen discovers Dracula has imprisoned\
        \ and killed her husband, Bob, inside their fridge. Dracula reveals his fascination\
        \ with modern luxuries, declaring them beyond the comprehension of historical\
        \ monarchs. He explains how oral consumption allowed him to download Bob's\
        \ memories. When Kathleen attempts to call authorities, Dracula is besieged\
        \ by Zoe's team, armed with heavy machinery, and forced to retreat into a\
        \ coffin prepared for him. \n\nDracula is moved to the Jonathan Harker Foundation\
        \ where researchers, led by Zoe, intend to study him. Zoe extracts blood,\
        \ discovering her cancer taints it. A lawyer, Frank Renfield, arrives, claiming\
        \ Dracula is being held against his will, asserting Dracula's legal rights\
        \ dating back to property acquisitions in 1896. Despite Zoe's protests, Dracula’s\
        \ rights are legally upheld. \n\nDracula emails Zoe, hinting at a future meeting,\
        \ stating he will select his blood carefully and observe how she reads blood.\
        \  That evening, Dracula is released. He steals Jack’s phone, who is part\
        \ of the research team, and makes contact with Lucy Westenra.\n\nThree months\
        \ later, Dracula is living in luxury in London. Zoe, now a patient in an oncology\
        \ ward, follows Dracula's activities in tabloid magazines. Quincey proposes\
        \ to Lucy, who continues a flirtatious conversation with Dracula via text.\
        \ Dracula manipulates the people around him, as did Zoe from her hospital\
        \ bed and Agatha, appearing to her as a vision, urging her to explore Dracula’s\
        \ limitations. \n\nLucy meets Dracula in a graveyard where he reveals his\
        \ ability to hear voices of the undead, as Lucy is drawn to the darkness in\
        \ Dracula, making her a perfect target. Zev suspects Lucy is cheating and\
        \ a heated disagreement ensues. After being attacked by Lucy, Zev calls Jack\
        \ for help to examine her, who makes a startling discovery after pulling down\
        \ her high Victorian collar.\n\nJack, Skypes Zoe from Lucy’s bedside and informs\
        \ her of her mark. Zoe summons Jack to her bedside and tells him that there\
        \ has been no progress in treatment and she fears the worst for her future.\
        \ Later that night, Lucy is visited by a demonic child, but as Lucy turns\
        \ out the light, Dracula appears to rescue her on her window ledge. \n\nLucy\
        \ is found dead in her bed the next morning. Her reflection is shown and she\
        \ reaches out hoping for help but is met by Dracula, telling her that soon\
        \ she will be set free. As Lucy’s funeral starts, she rises in the coffin.\
        \ Zev sees Lucy being removed from the church and runs in after her for help.\
        \ \n\nJack seeks advice from Zoe, who is very ill, about Dracula's choice\
        \ of victims. Zoe asks Jack to go back and observe Lucy as she must be unique\
        \ for Dracula to want to feed on their night, her cremated remains are returned\
        \ to the family in a small wooden box as most of the service go home. He then\
        \ notices Frank, but does not confront him, instead heads home as he is being\
        \ stalked by his former friends. \n\nZoe reveals Dracula’s fears are tied\
        \ to things that prevent him from being true to himself, preventing him from\
        \ facing death head-on. Desperate to make good of her life Zoe faces Dracula\
        \ one more time and the episode concludes as does her life when Dracula cannot\
        \ bring her back again. \n\nHaunted by dreams connected to Zoe and his hunger,\
        \ Dracula sees her reflected in the mirror, taunting him for failing to possess\
        \ a virtue he craves – the strength to face death without fear. Dracula and\
        \ Zoe are locked in a close embrace as all fades to red."
      dominant_tone: Tragic
