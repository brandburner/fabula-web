- fabula_uuid: ser_dracula
  title: Dracula
  description: In a chilling blend of gothic horror and modern suspense, **Dracula**
    reimagines the legendary vampire’s timeless battle between darkness and redemption.
    When the ancient Count **Dracula** awakens in the 21st century, he finds himself
    hunted by **Zoe**, a fierce descendant of Van Helsing, whose own ties to the cursed
    **Lucy Westenra** blur the line between enemy and ally. But his thirst for power
    stretches back to 1897, where **Sister Agatha** and **Mina Murray** risk everything
    to stop his invasion of England before his evil spreads. As past and present collide,
    **Dracula** must confront whether he can escape his monstrous nature—or if the
    world will destroy him first. A haunting, atmospheric saga where love, vengeance,
    and immortality clash in the shadows.
