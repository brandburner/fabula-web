    the vampire directly, while Jonathan's feverish body lies at the center, veins
    marbled, under desperate prayers. This former sanctuary turns battleground, crackling
    with tension as faith meets encroaching darkness.
  location_type: Convent Courtyard
  parent_location_uuid: null
