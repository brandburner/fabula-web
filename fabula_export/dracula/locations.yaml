  parent_location_uuid: null
- fabula_uuid: location_c10d38dd86bf
  global_id: null
  canonical_name: Dr. Sharma’s Lab (Calcutta)
  description: 'Dr. Sharma''s lab in Calcutta pulses with heat and tension: open shutters
    admit sultry night air laced with cricket chirps into a dense clutter of scientific
    equipment and bloodstained examination tables. Gupta and Khan dump the exhumed
    coffin here amid sweat-drenched oppression, where Sharma''s scalpel reveals seventy-year-old
    burial scratches alongside fresh claw marks. The space fractures under science''s
    assault on the undead as a cold exhalation escapes the coffin and a monstrous
    shadow rises, blending clinical precision with primal dread.'
  location_type: Pathology Laboratory
  parent_location_uuid: null
- fabula_uuid: location_0bf819aae262
  global_id: null
  canonical_name: Dracula's Apartment
  description: Dracula's high-rise apartment overlooks London's city lights through
    a heavily draped picture window. A long black ebonized table gleams as a reflective
    surface, exposing illusions amid luxury. Modern touches—a treadmill, Tinder app—clash
    with opulent furnishings in this billionaire's lair. The space hosts tense confrontations,
    feedings on Zoe, Lucy's mercy killing, and Dracula's rants against the era. Opulence
    amplifies his alienation, turning private intimacy into a gothic stage for vampire
    struggles and human intrusions.
  location_type: Luxury High-Rise Apartment
  parent_location_uuid: null
- fabula_uuid: location_81a5ba82c32f
  global_id: null
  canonical_name: Dracula's Burial Chamber (Castle Crypt)
  description: A *dead* space—a crypt where Dracula lies in stasis, reanimated corpses
    lurk, and Harker’s curiosity triggers a *predatory resurrection*. Central to Dracula’s
    awakening, not the brides’ rituals. This cavernous, low-ceilinged stone crypt
    beneath Castle Dracula is also described as a storage room packed with towering
    cases that scatter like tombstones, amplifying the oppressive atmosphere. Jonathan
    Harker confronts a vault of horrors here—Dracula’s predatory domain, threshold
    to buried abominations and inevitable corruption. The space serves as both a burial
    chamber and a storage crypt, where Harker’s sanity crumbles amid the decay.
  location_type: Ancient Vampire Crypt
  parent_location_uuid: null
- fabula_uuid: location_0ef8ffb06d09
  global_id: null
  canonical_name: Dracula's Castle (Transylvania)
  description: A **Gothic fortress** built into the Carpathian Mountains, serving
    as the **primary setting** for Dracula's reign of terror. The castle is a **man-made
    structure** with **interior spaces** (e.g., Bridal Chamber, labyrinthine halls,
    shadowed veranda, dining room, **open courtyard**) and **inhabitants** (Dracula,
    vampiric brides, reanimated corpses). The **courtyard**—framed by archways and
    connected to the castle's labyrinthine stairs—serves as a **psychological trap**
    for Jonathan Harker, where his repeated emergence strips him of rationality. Portraits
    lining the courtyard reinforce his entrapment, and the space's 'alive malice'
    defies logic, mirroring the castle's sentient maze system. Its narrative function
    is **active and plot-driven**, contrasting with the mountains' **passive, atmospheric
    role**.
  location_type: Gothic Castle
  parent_location_uuid: null
- fabula_uuid: location_5df19eeeae97
  global_id: null
  canonical_name: Dracula's Castle Archways and Labyrinth Stairs (Sentient Maze System)
  description: A disorienting, sentient maze system within Castle Dracula, comprising
    *shadowy archways* and *twisting labyrinth staircases* that trap Jonathan Harker
    in endless loops. The archways link corridors and courtyards, while the staircases
    ascend into dim passageways and descend into echoing voids, always returning Harker
    to the same locations. The system is designed to *shred rationality*, fuel frustration,
    and assert the castle's control, with claustrophobic and illogical paths that
    defy maps and reason. The maze includes *grand staircases*, *hidden spiral staircases*,
    and *fly-infested passages*, all contributing to Harker's psychological erosion.
  location_type: Labyrinthine Castle Archways
  parent_location_uuid: null
- fabula_uuid: location_5d2852e5c23c
  global_id: null
  canonical_name: Dracula's Castle Battlements
  description: High atop Dracula's castle, the battlements form a narrow, exposed
    walkway of weathered stone parapets battered by Carpathian night winds. Harker
    stumbles here in his fresh undead agony, veins blackening, body twisting as he
    unleashes a primal scream that echoes into the void—a vow of rebellion. Dracula
    strikes him down; his broken form sprawls across the cold stones, fingers clawing
    the edge in futile grasp for life amid utter isolation.
  location_type: Castle Battlements
  parent_location_uuid: null
- fabula_uuid: location_ba2fd770c484
  global_id: null
  canonical_name: Dracula's Chamber
  description: Zoe awakens in this spacious, ornate bedchamber deep within Castle
    Dracula, her body radiant yet marked by Dracula's predatory bite at her neck.
    Heavy opulence evokes the vampire's ancient past, shadows thick with gothic horror
    and supernatural tension. The air later hums with the weight of shared doom during
    Zoe and Dracula's climactic confrontation, transforming the space into a battleground
    for their emotional and physical struggle toward inevitable resolution.
  location_type: Gothic Castle Bedchamber
  parent_location_uuid: null
- fabula_uuid: location_081756f67317
  global_id: null
  canonical_name: Dracula’s Castle Dining Hall (Harker’s Torment Chamber)
  description: Oppressive, gothic dining room within Dracula’s Castle, central to
    Jonathan Harker’s psychological breakdown and predatory hospitality. Features
    a coffin-crate, wingback armchair, and eerie acoustics (e.g., baby’s cries), serving
    as a symbol of Dracula’s power and Harker’s vulnerability. Key setting for gothic
    horror in 'The Rules of the Beast' (S01E01).
  location_type: Gothic Castle Dining Room
  parent_location_uuid: null
- fabula_uuid: location_cf8b5f924b56
  global_id: null
  canonical_name: Dracula’s Containment Unit
  description: Dracula paces inside a glass cell within a large, square room of bare
    white walls. A chemical toilet, table, chair, and steel coffin furnish the confined
    space. The ceiling splits open to unleash sunlight, Zoe's lethal leverage in their
    tense interrogations. Guards stand watch outside as sterile surfaces amplify psychological
    clashes, blood extractions, and legal standoffs. Tension builds in this Harker
    Foundation chamber, where modern science grapples with ancient evil.
  location_type: High-Security Vampire Containment Cell
  parent_location_uuid: null
- fabula_uuid: location_3568994f5c9d
  global_id: null
  canonical_name: Dream Dance
  description: Dracula spins the youthful Duchess across this dreamlike floor in a
    grotesque waltz amid whirling candlelight and echoing music. The disorienting
    space traps them in eternal motion, her enraptured embrace masking his predatory
    intent. Shadows and flames blur boundaries, embodying the vampire's centuries-long
    ritual of seduction that ends in ruin. Victims enter willingly, doomed to repeat
    the cycle.
  location_type: Surreal Dream Ballroom
  parent_location_uuid: null
- fabula_uuid: location_b4b7a42cdb28
  global_id: null
  canonical_name: Duchess's 18th Birthday Ballroom
  description: The Duchess recalls her 18th birthday celebration in this grand ballroom,
    where aristocrats mingled amid dances and presented rare gifts like a pineapple.
    Candlelight gleamed on polished floors and ornate walls, filling the air with
    music, laughter, and the sweet tang of exotic fruit. Dracula's presence that night—tied
    to her mother's disappearance—now poisons the memory, turning festive opulence
    into a haunting trap of repressed trauma that he wields to shatter her composure.
  location_type: Aristocratic Ballroom
  parent_location_uuid: null
- fabula_uuid: location_09ec7f169aa7
  global_id: null
  canonical_name: Duchess's Cabin (Demeter)
  description: Dracula enters the Duchess's cabin on the Demeter and feeds on the
    Grand Duchess, her blood spilling across cramped wooden bunks and brass fittings.
    Portholes frame churning black waves under moonlight, while the air hangs heavy
    with salt, fear, and coppery tang. Shadows cloak the vampire's approach, the confined
    space amplifying the ship's exposure to his predations as screams echo unheard
    through thin bulkheads.
  location_type: Ship Passenger Cabin
  parent_location_uuid: null
- fabula_uuid: location_90bdaf3551ff
  global_id: null
  canonical_name: England's Shores (Coastline of Invasion)
  description: The English coastline, framed by the moon or sunset, serves as the
    threshold for Dracula's invasion. Described as both a 'promise of refuge' for
    the doomed crew of the *Demeter* and a 'threshold' where supernatural corruption
    first touches land, this shoreline is a duality of hope and doom. The mist from
    the ship's prow curls toward it, waves carry the vampire's influence, and the
    horizon underscores the inevitability of England's predation. The setting captures
    both the crew's desperate final moments and the ominous arrival of Dracula's curse.
  location_type: National Coastline
  parent_location_uuid: null
- fabula_uuid: location_ed6ca67a952c
  global_id: null
  canonical_name: Frank’s Car
  description: Frank’s car encloses Dracula and Frank in dusk-lit confinement, its
    tight seats and dashboard glow framing dual obsessions. Casual talk exposes Jonathan
    Harker Foundation secrets, then Lucy Westenra's photo on Jack’s phone seizes Dracula's
    predatory focus. The cramped space intensifies his impersonation of Seward during
    her call, blending institutional intrigue with personal hunger amid the low hum
    of motion.
  location_type: Automobile Interior
  parent_location_uuid: null
- fabula_uuid: location_b72c78b485e3
  global_id: null
  canonical_name: Front Row Pews, Dellside Crematorium Chapel
  description: Indoor front row of pews in the Dellside Crematorium chapel, positioned
    closest to Lucy’s coffin during her funeral service. Sterile and ritualistic,
    with packed benches, a Vicar’s liturgy, and Quincey’s packed suitcase as a narrative
    detail.
  location_type: Crematorium Pews
  parent_location_uuid: null
- fabula_uuid: location_737979bc057e
  global_id: null
  canonical_name: Gangway of the Demeter
  description: Ramp or walkway connecting the dock to the Demeter’s deck, serving
    as the primary boarding area for passengers and crew.
  location_type: Merchant Ship Gangway
  parent_location_uuid: null
- fabula_uuid: location_03d2636230e7
  global_id: null
  canonical_name: Hallway (Half-Open Door)
  description: A shadowy hallway adjoins the dining room in Dracula's castle, its
    half-open door framing distant echoes of a baby's desperate cries. The piercing
    wails cut through the night's silence, evoking trapped innocence amid vampiric
    indifference. Dracula ignores the sound while manipulating Jonathan, who fixates
    on it briefly amid his torment. This auditory intrusion heightens the scene's
    dread, contrasting human vulnerability against the castle's merciless domain.
  location_type: Castle Hallway
  parent_location_uuid: null
- fabula_uuid: location_7bec444dd1b5
  global_id: null
  canonical_name: Hallway Leading to Front Door and Staircase
  description: Kathleen enters this connecting space in her suburban home, stepping
    from front door access and upstairs stairs into the kitchen/living area. Daylight
    filters through, carrying everyday domestic echoes—until it funnels her toward
    Dracula's grotesque fridge scene. Narrow walls frame her path, the front door
    promising escape now blocked by horror within, stairs hinting at untouched upper
    floors amid the unfolding nightmare.
  location_type: Suburban Home Hallway
  parent_location_uuid: null
- fabula_uuid: location_8a87f5a372a4
  global_id: null
  canonical_name: Hallway Outside Lucy's Bedroom
  description: Meg stands in this narrow domestic hallway directly outside Lucy's
    bedroom door during daytime. She calls out cheerfully, offering tea to Lucy inside,
    her voice carrying innocent concern through the closed door. Sunlight filters
    into the space, filling it with everyday normalcy—cluttered shoes or family photos
    line the walls perhaps—but Meg senses nothing amiss. The hallway sharply contrasts
    the bedroom's concealed supernatural horror, its mundane quiet underscoring oblivious
    human life brushing against vampiric dread.
  location_type: Residential Hallway
  parent_location_uuid: null
- fabula_uuid: location_b66410dc6c3e
  global_id: null
  canonical_name: Harbor of the Demeter
  description: 'A coastal harbor where the *Demeter* ship is docked, serving as a
    pivotal location in the narrative. The harbor is described through two distinct
    but complementary perspectives: (1) a distant, atmospheric view from a hospital
    window, where the ship looms ominously against the daylight, symbolizing both
    escape and doom; and (2) a chaotic, up-close depiction of the dock at dusk, filled
    with activity, foreboding imagery (coffin-like boxes, flies, decay), and the materialization
    of Dracula. The location is central to the story''s themes of curse, adventure,
    and inevitability, with the *Demeter* as its focal point.'
  location_type: Coastal Harbor
  parent_location_uuid: null
- fabula_uuid: location_d4ce5d6f2a4e
  global_id: null
  canonical_name: Hills Above Whitby
  description: Elevated clifftops overlooking Whitby, marked by rugged terrain, howling
    winds, and fading light. Serves as the primary site for psychological clashes,
    moral dilemmas, and supernatural symbolism.
  location_type: Coastal Cliff Tops
  parent_location_uuid: null
- fabula_uuid: location_fe25c3298082
  global_id: null
  canonical_name: Hospital Exterior
  description: External facade of the hospital, symbolizing the liminal threshold
    between human order and supernatural intrusion. Key setting for Zoe's illness
    arc and Dracula's modern awakening in *The Dark Compass* (Episode 3).
  location_type: Hospital Exterior
  parent_location_uuid: null
- fabula_uuid: location_700bd7e12748
  global_id: null
  canonical_name: Hospital Ward
  description: Interior hospital ward where Piotr’s vampiric corruption is addressed
    through a ritual staking. Clinical space invaded by supernatural horror, contrasting
    sterile medicine with familial grief and violence in *Blood Vessel* (Episode 2).
  location_type: Hospital Ward
  parent_location_uuid: null
- fabula_uuid: location_9cbe67366b9b
  global_id: null
  canonical_name: Hotel Exterior & Neon-Lit Street (Night) – Lucy’s Spectral Threshold
  description: The liminal urban space outside the hotel, where neon lights distort
    the boundary between the hotel facade and the empty street. This exterior serves
    as the **threshold** for Lucy’s transformation into a spectral force, emphasizing
    her detachment from humanity through **reflections in jagged shop windows** and
    **echoing footsteps**.
  location_type: Urban Hotel Exterior
  parent_location_uuid: null
- fabula_uuid: location_ab0b979a2b24
  global_id: null
  canonical_name: Hotel Room (Interior) – Zev and Lucy’s Confrontation Site
  description: The claustrophobic interior space where Zev and Lucy’s drunken confrontation
    unfolds, later becoming the site of Zev’s panicked awakening to Lucy’s absence.
    Defined by twin beds, an orange lamp, and a digital clock, this room serves as
    the emotional core of their human drama before Lucy’s supernatural departure.
  location_type: Hotel Room
  parent_location_uuid: null
- fabula_uuid: location_af81067e1fa8
  global_id: null
  canonical_name: Hungarian Convent (Dracula's Attack Site)
  description: A remote Hungarian convent serving as a desperate refuge during Dracula's
    assault. The sacred space includes both its candlelit halls and the **inner sanctum**,
    where the Mother Superior is decapitated by Dracula, unleashing snarling wolves.
    Nuns form protective semi-circles with stakes in the sanctum, while Jonathan Harker
    confesses castle horrors to Sister Agatha and reunites with Mina, the Silent Nun.
    The walls tremble under vampiric assault, air thickens with dread, and reanimated
    corpses plead amid tolling bells, transforming the fragile refuge into a slaughterhouse
    of snarls, screams, and trembling stone. Key events include the Mother Superior's
    death in the **inner sanctum**, the wolves' rampage, and the failed protective
    wards. The **iron gate exterior** marks the threshold where Dracula's influence
    first breaches sacred ground.
  location_type: Convent
  parent_location_uuid: null
- fabula_uuid: location_be677761f100
  global_id: null
  canonical_name: Hungary (1897)
  description: A Hungarian city in 1897 thrusts towers and minarets into a clear blue
    sky, its skyline visible through convent windows. This urban backdrop isolates
    the convent amid daylight serenity, yet frames Dracula's supernatural threats.
    Sunlight streams in, sharpening the tension between the bustling city below and
    the horrors infiltrating the sacred space above.
  location_type: Historical Hungarian City
  parent_location_uuid: null
- fabula_uuid: location_674d6c73a611
  global_id: null
  canonical_name: Jack Seward's Bedsit
  description: Jack Seward's bedsit stands as an orderly, disciplined space that mirrors
    his precise personality. Sunlight fills the intimate room during the day, where
    a bedside table holds his buzzing smartphone. Jack tosses the phone aside here,
    rejecting calls from Jonathan Harker amid sterile precision that contrasts Lucy
    Westenra's chaotic bedroom. The quiet sanctuary hosts his internal conflicts,
    as he hesitates over Lucy's selfies and invitations, tension building between
    controlled routine and encroaching legacies.
  location_type: Private Bedsit
  parent_location_uuid: null
- fabula_uuid: location_47505847e1f2
  global_id: null
  canonical_name: Jack’s Bedroom
  description: Jack’s bedroom unfolds at night as a stark, intimate refuge turned
    confessional. Shadows pool in corners, sharpening the room’s isolation. The air
    grows thick with unspoken dread while Jack grips the phone and tells Zoe she’s
    dying. Tension saturates the space, his clinical words echoing off bare walls,
    heightening the personal devastation against her vampire-hunting quest. Every
    breath weighs heavy with foreboding finality.
  location_type: Private Residential Bedroom
  parent_location_uuid: null
- fabula_uuid: location_3c210cfeaea3
  global_id: null
  canonical_name: Jack’s Introspective Car Interior
  description: A confined, moving space where Jack Seward grapples with immortality,
    obsession, and redemption in isolation, with sunlight as an existential threat.
    Distinct from group dynamics in other vehicles.
  location_type: Vehicle Interior
  parent_location_uuid: null
- fabula_uuid: location_fc66e5f5f023
  global_id: null
  canonical_name: Jonathan Harker Foundation Briefing Room (Repurposed Chapel)
  description: Modern lecture theatre within the Jonathan Harker Foundation’s headquarters,
    repurposed from a chapel. Serves as a training space for recruits (badged by blood
    type) during lectures on Dracula’s revival, blending gothic architecture with
    contemporary technology. Key setting for modern-day resistance activities in 'The
    Dark Compass' (S01E03).
  location_type: Foundation Lecture Theatre (Repurposed Chapel)
  parent_location_uuid: null
- fabula_uuid: location_ca6d9e4dc8e8
  global_id: null
  canonical_name: Jonathan Harker Foundation Exterior, Whitby
  description: Heavy doors of the Jonathan Harker Foundation swing open at dusk in
    Whitby, releasing Dracula into the 21st century. Darkened skies loom overhead
    as he steps forward, tilting his head to assess the world like a predator scenting
    prey. The dusky air thickens with tension, shadows lengthening across the grounds
    to underscore his ominous arrival and the collision of ancient evil with modern
    defenses. This threshold pulses with anticipation, the foundation's former sanctuary
    now a launch point for invasion.
  location_type: Research Foundation Exterior
  parent_location_uuid: null
- fabula_uuid: location_d3cdd39fc298
  global_id: null
  canonical_name: Jonathan Harker Foundation Facility
  description: The Jonathan Harker Foundation Facility is a multi-purpose containment
    and research complex in Whitby, repurposed from its original Gothic architecture.
    It serves as the primary location for Dracula's isolation and study, featuring
    specialized areas including a sterile **Isolation Area** (where Dracula's coffin
    is held), a **Surgical Room** (for processing recruits and medical procedures),
    **Corridors** (for movement between secure zones), and **Stairwells** (e.g., the
    one where Zoe Van Helsing ascends with urgent footsteps). The facility blends
    clinical precision with Gothic heritage, as evidenced by the portrait of Jonathan
    Harker and the fusion of modern technology (fluorescent lights, monitors) with
    historic elements (stone arches, stained glass). Key interactions occur here between
    Dracula, the Foundation staff (Zoe Van Helsing, Jack Seward, nurses), and other
    characters, all within a high-security environment designed to contain supernatural
    threats. The stairwell is a critical pathway within this network, marked by 'NO
    UNAUTHORIZED ACCESS' signs and institutional tension.
  location_type: Scientific Isolation Area
  parent_location_uuid: null
- fabula_uuid: location_7cdbbae65f48
  global_id: null
  canonical_name: Jonathan Harker's Corrupted Bedroom in Castle Dracula
  description: Jonathan Harker's initial bedroom in Castle Dracula, where he experiences
    psychological and physical corruption at Dracula's hands. Unlike the unexplored
    chamber above his prison-like cell, this room is a *lived-in space* with opulent
    but claustrophobic features (fireplace, heavy curtains, stained-glass windows)
    that mask its role as a site of violation. Key events—such as the shattering of
    the mirror, the projection of 'HELP US' shadows, and Jonathan's disoriented awakenings—occur
    here, marking it as the *starting point of his captivity* before he escapes into
    the corridors.
  location_type: Gothic Castle Bedroom
  parent_location_uuid: null
- fabula_uuid: location_d4fc5dbc82b7
  global_id: null
  canonical_name: Junction of Corridors in Castle Dracula
  description: A critical branching point in Castle Dracula's labyrinth where Jonathan
    Harker pauses to study diagrams and grapple with disorientation, marking a moment
    of decision-making amid the castle's engineered confusion.
  location_type: Castle Corridor Junction
  parent_location_uuid: null
- fabula_uuid: location_476c1cec8572
  global_id: null
  canonical_name: Kathleen's Bedroom
  description: Kathleen's private sleeping space, distinct from the upstairs landing,
    where Dracula invades her psychological security through manipulation (e.g., drawing
    curtains, cryptic threats about her husband). The bedroom symbolizes her isolation
    and vulnerability, with an empty half of the bed amplifying her loneliness.
  location_type: Private Residential Bedroom
  parent_location_uuid: null
- fabula_uuid: location_a16bbdf747e8
  global_id: null
  canonical_name: Kathleen's House Exterior (Daylight)
  description: 'The exterior space of Kathleen''s suburban house, where the open front
    door becomes a lethal threshold for Dracula due to the harsh daylight flooding
    through. This space serves as a critical narrative barrier: Kathleen wrenches
    the front door open in terror, causing sunlight to pour in and burn Dracula''s
    skin, forcing him to recoil in agony. The exterior''s bright daylight transforms
    a mundane residential front into a vampiric bane, highlighting Dracula''s primal
    weakness against ordinary day rays. The scene emphasizes the contrast between
    domestic safety and supernatural peril, with the front door acting as both an
    escape route and a deadly trap.'
  location_type: Suburban House Exterior
  parent_location_uuid: null
- fabula_uuid: location_2aed4780009d
  global_id: null
  canonical_name: Kathleen's House Hallway
  description: Kathleen sprints down this narrow hallway in her modern suburban home,
    Dracula pursuing close behind during the frantic daytime chase. She flings open
    the front door at its end, unleashing streams of harsh daylight that flood the
    passage and sear the vampire's skin, forcing him to recoil in pain. The confined
    space channels their pursuit, walls closing in amid thumps of footsteps, bridging
    the shadowed interior to the lethal threshold of sunlight and amplifying raw terror
    of escape.
  location_type: Suburban Home Hallway
  parent_location_uuid: null
- fabula_uuid: location_f82486955fae
  global_id: null
  canonical_name: Kathleen's House Interior
  description: Encompasses the entire interior of Kathleen's home, including the kitchen,
    hallway, front door, and *upstairs landing* (see location_f82486955fae_sub). The
    space serves as a backdrop for Dracula's initial exploration and the contrast
    between modern domesticity and supernatural horror.
  location_type: Suburban Home Interior
  parent_location_uuid: null
- fabula_uuid: location_1768133fb17a
  global_id: null
  canonical_name: Kathleen's House Living Room/Kitchen
  description: A shabby, cramped apartment space that merges a grubby kitchen with
    a small sitting area, serving as the primary setting for Kathleen's confrontation
    with Dracula. The room features drawn curtains blocking morning sunlight, a television
    playing a cheap Western, and a fridge yanked from the wall with ropes straining
    against Bob's folded body clawing from inside. The space is half-collapsed in
    places, with a leaning wall threatening to buckle and a sagging ceiling, while
    sunlight shafts pierce jagged holes. Dracula explores the kitchen with wide-eyed
    awe, flicking light switches, opening the fridge (where Bob's severed hand later
    claws from within), and rinsing a bloody knife at the sink. The mundane domestic
    space—blending sterile appliances, running water, and gore—twists into a site
    of vampire wonder and horror as Kathleen cowers in fear. A hallway branches from
    this area to the front door and staircase, framing the scene's claustrophobic
    tension. The fridge dominates the room's center, its unguarded door revealing
    Bob's mutilated, flailing body begging for release, heightening Zoe's dread during
    her gruesome discovery and Dracula's looming confrontation.
  location_type: Shabby Apartment Kitchen/Living Area
  parent_location_uuid: null
- fabula_uuid: location_8626e4abe010
  global_id: null
  canonical_name: Kathleen's House – Upstairs Landing (Trap Site)
  description: A transitional upper-space area in Kathleen's house, distinct from
    her bedroom, where Dracula discovers a Harker Foundation trap (steel coffin, sacred
    soil, and ringing phone). This landing serves as a narrative threshold between
    the house's lower levels and Kathleen's private bedroom, emphasizing the intrusion
    of the supernatural into domestic space.
  location_type: Suburban House Landing
  parent_location_uuid: null
- fabula_uuid: location_11d5f1f29c5e
  global_id: null
  canonical_name: Klausenberg
  description: Klausenberg stands as a modest Transylvanian town where Jonathan Harker
    boards his carriage toward Castle Dracula, encountering the warning girl amid
    local superstitions. Dracula scorns it as barren—lacking 'anything to eat' or
    'flavour,' its people and lifeblood thin and narrow compared to England's vitality.
    The town embodies provincial dreariness, a stark foil to the Count's predatory
    elegance and ambitions, its dusty roads and wary folk underscoring the vampire's
    disdain for such unremarkable sustenance.
  location_type: Transylvanian Town
  parent_location_uuid: null
- fabula_uuid: location_e0d0fb47cfb7
  global_id: null
  canonical_name: Liminal Space (Disorienting Transition Zone)
  description: An abrupt narrative cut thrusts characters and audience into this disorienting
    in-between realm, severing all sense of time and place. Boundaries dissolve between
    past and present, human and monstrous, as Dracula's influence corrodes reality
    itself. Sister Agatha and Mina confront the supernatural's physical encroachment
    here, their perceptions realigned in a psychological crucible that foreshadows
    Jonathan Harker's vampiric transformation. The space demands viewers question
    their own sight amid the encroaching horror.
  location_type: Narrative Liminal Zone
  parent_location_uuid: null
- fabula_uuid: location_e1a75f2c3b70
  global_id: null
  canonical_name: Limousine Backseat
  description: Night envelops the limousine's backseat, where leather confines Alice
    and Lucy in suffocating intimacy. Alice probes about 'D' on Lucy's phone; Lucy
    shrugs, averts her gaze, and fingers the bruise beneath her choker. Dim light
    catches these betrayals, turning the luxury space into a claustrophobic cage.
    Tension builds as Lucy dodges questions, her body revealing the pull between carefree
    facade and sinister secrets.
  location_type: Limousine Backseat
  parent_location_uuid: null
- fabula_uuid: location_ab9cea97a359
  global_id: null
  canonical_name: Lucy and Dracula's Nightclub
  description: Scene of Lucy Westenra's hypnotic dance and Dracula's predatory observation,
    framed as a hunting ground where sensory overload amplifies his obsessive focus
    on her.
  location_type: Urban Nightclub
  parent_location_uuid: null
- fabula_uuid: location_8a7e59bb46a0
  global_id: null
  canonical_name: Lucy's Bedroom
  description: A persistent, lived-in space in Lucy Westenra's home, serving as the
    nexus of her dual existence—both her sunlit public life and her moonlit private
    nightmares. Unlike the coffin interior, this space is not tied to her death but
    to her vulnerability, haunting, and the forces converging upon her (Dracula, demonic
    children, Jack's unraveling trust).
  location_type: Private Residential Bedroom
  parent_location_uuid: null
- fabula_uuid: location_fa7d04f70ff8
  global_id: null
  canonical_name: Lucy's Coffin Interior
  description: A transient, ritualistic space existing solely during Lucy Westenra's
    cremation, where her corpse is consumed by flames and her screams echo off the
    unyielding wooden walls. This is the site of her supernatural rebirth into a vengeful
    specter, distinct from her living or undead spaces.
  location_type: Coffin Interior
  parent_location_uuid: null
- fabula_uuid: location_05b3b1092470
  global_id: null
  canonical_name: Lucy’s Stretch Limo Interior
  description: A stretch limousine where Lucy Westenra and her friends engage in hangover
    jokes and social tension, masking deeper fractures. Lucy’s dominance and phone
    messages from 'D' foreshadow future conflicts.
  location_type: Stretch Limousine Interior
  parent_location_uuid: null
- fabula_uuid: location_b79bd3211c22
  global_id: null
  canonical_name: Main Hall Hallway, Castle Dracula
  description: Jonathan Harker confronts Dracula in this transitional hallway, a narrow
    stretch within the main hall's suffocating opulence. A table sits here holding
    a wriggling carpet bag; infant cries spill out as Dracula lifts it and ascends
    nearby stairs. Horrified pleas echo off the walls while the vampire denies the
    baby's existence. Flickering light and oppressive grandeur trap Jonathan, exposing
    the Count's predation and shattering his illusions in this threshold of dread.
  location_type: Castle Hallway
  parent_location_uuid: null
- fabula_uuid: location_52cae80da0f6
  global_id: null
  canonical_name: Mina's Bedroom
  description: 'Mina''s private bedroom, a space that serves as both a personal refuge
    and a battleground for her emotional and psychological struggles. The room is
    depicted in two key narrative moments: (1) a quiet, daylight-filled setting where
    Mina pens a flirtatious yet vulnerable letter to Jonathan, revealing her fears
    of abandonment and attempts to provoke reassurance through subtle emotional manipulation;
    (2) a tense, liminal space dominated by the mechanical clacking of a typewriter,
    where Mina''s posture and breath reflect her growing psychological fragility and
    the unseen influence of Dracula. The room''s dual portrayal—from intimate sanctuary
    to disorienting psychological zone—mirrors Mina''s internal conflict and the escalating
    supernatural threat in her life. The space is consistently described as a private
    residential bedroom, though its narrative function shifts from personal vulnerability
    to supernatural tension.'
  location_type: Private Residential Bedroom
  parent_location_uuid: null
- fabula_uuid: location_8f91380e9d8a
  global_id: null
  canonical_name: Moonlit Abbey Ruin (Dream Sequence)
  description: Supernatural horror space where Zoe Helsing and Dracula engage in a
    grotesque, transformative confrontation. The environment is a character—warped,
    nightmarish, and reflective of their fractured psyches, tied to Dracula’s haunted
    past.
  location_type: Dreamlike Gothic Abbey Ruin
  parent_location_uuid: null
- fabula_uuid: location_b5802aa61df3
  global_id: null
  canonical_name: Mottisfont
  description: A *recreated* Van Helsing ancestral site within Zoe's oncology ward,
    blending gothic stone architecture with modern medical sterility. Serves as a
    haunted space tied to Agatha Van Helsing's spectral presence and the bloodline's
    inherited trauma, symbolizing the clash between past and present.
  location_type: Historical Estate
  parent_location_uuid: null
- fabula_uuid: location_a0732ccfbb3b
  global_id: null
  canonical_name: Neon London (Modern)
  description: Modern urban metropolis functioning as a hunting ground for Dracula.
    The city is a dynamic, open space where his predatory instincts are tested against
    21st-century life, contrasting with his ancient immortality.
  location_type: Neon-Lit Metropolis
  parent_location_uuid: null
- fabula_uuid: location_8cd8fdf87084
  global_id: null
  canonical_name: Nightclub
  description: Scene of Jack Seward and Quincey Morris's tense moral confrontation,
    emphasizing class conflict and the nightclub's role as a site of superficiality
    and transactional interactions.
  location_type: Nightclub
  parent_location_uuid: null
- fabula_uuid: location_787e4edb7d9a
  global_id: null
  canonical_name: North Sea
  description: Broader geographic body of water through which the Demeter ship (and
    its prow) travels; serves as the environmental and symbolic threshold for Dracula's
    invasion of England.
  location_type: Open Sea Expanse
  parent_location_uuid: null
- fabula_uuid: location_766098417f95
  global_id: null
  canonical_name: Outside Kathleen's Demolished Cottage
  description: 'Dust swirls thick in the air outside Kathleen''s collapsed cottage,
    carrying the sharp, acrid bite of scorched wood from sunlight that earlier burned
    Dracula''s flesh. Rubble piles high across the debris-strewn ground, marking the
    Harker Foundation''s demolition assault to ensnare the vampire. Zoe stands firm
    amid the wreckage in tactical gear and hard hat, phone to her ear, voice slicing
    through the chaos with her unyielding command: ''Get in the box.'' Daylight beats
    down on the ruins, turning the site into a raw symbol of modern hunters'' dominance
    over ancient evil.'
  location_type: Demolished Cottage Exterior
  parent_location_uuid: null
- fabula_uuid: location_3440a2144371
  global_id: null
  canonical_name: Outskirts of Whitby
  description: Aerial shots sweep over Whitby's picturesque coastal town before zeroing
    in on a rotting cottage at the outskirts. Damp streaks scar its square, utilitarian
    frame; decay gnaws at sagging timbers that creak in unnatural silence—no birds
    call, no wind stirs. This cursed spot contrasts town beauty with grotesque rot,
    serving as a threshold where supernatural decay invades the present, echoing bloodline
    trauma and foreshadowing Zoe's entanglement in unseen forces.
  location_type: Coastal Town Outskirts
  parent_location_uuid: null
- fabula_uuid: location_74a69c8b8b1d
  global_id: null
  canonical_name: Perched Hill of the Rotting Cottage
  description: The hill rises on Whitby’s outskirts, perching the rotting cottage
    in stark isolation. Damp streaks mar the cottage’s sagging frame, which creaks
    faintly in unnatural stillness—no birds call, no wind stirs. This elevated spot
    frames the grotesque decay against the coastal town’s distant charm, amplifying
    eerie quiet and supernatural tension. Characters approaching sense the cursed
    threshold, where rot seeps from past traumas into the present, mirroring fragile
    isolation amid encroaching horror.
  location_type: Isolated Coastal Hilltop
  parent_location_uuid: null
- fabula_uuid: location_c32f15a7446e
  global_id: null
  canonical_name: Prow of the Demeter
  description: Specific forwardmost part of the Demeter ship where Dracula stands;
    serves as his **physical vantage point** and **tactical location** for actions
    (e.g., exhaling smoky mist, inhaling salty air).
  location_type: Sailing Ship Prow
  parent_location_uuid: null
- fabula_uuid: location_91da872ff91d
  global_id: null
  canonical_name: Quarter Deck of the Demeter
  description: Elevated command area on the Demeter used by officers for discussions
    and oversight of deck activities, distinct from the gangway where passengers board.
  location_type: Merchant Ship Quarterdeck
  parent_location_uuid: null
- fabula_uuid: location_406575895b10
  global_id: null
  canonical_name: River/Sea
  description: Turbulent waters of the River/Sea claim Jonathan Harker, who drifts
    drowned but alive, tangled in a fisherman's coarse net. Choppy currents carry
    him from Dracula's shadowed castle to the convent's threshold, the briny chill
    seeping into his bones as fishermen pull his limp form aboard. Salt spray mists
    the air, waves slap against hulls, and the site's murky depths echo the narrow
    escape from supernatural peril, blending river's rush with sea's vast mystery.
  location_type: Estuarine Body of Water
  parent_location_uuid: null
- fabula_uuid: location_423ec9724551
  global_id: null
  canonical_name: Road Outside Dellside Crematorium
  description: Daylight bathes this road fronting the Dellside Crematorium, where
    Quincey Morris loads suitcases into a waiting taxi right after Lucy's funeral.
    His quick, detached motions stay hidden from mourners inside, the engine's low
    idle underscoring his swift exit. Jack Seward watches from a distance, the open
    space charged with quiet cynicism and the sting of revealed motives amid fading
    echoes of liturgy.
  location_type: Crematorium Access Road
  parent_location_uuid: null
- fabula_uuid: location_ceb926577568
  global_id: null
  canonical_name: Rock Tunnel
  description: This low, narrow rock tunnel leads directly into Dracula’s burial chamber.
    Rough stone walls close in tightly, forcing Jonathan Harker to crouch as reanimated
    corpses shuffle through, their guttural moans echoing off the confines. Lantern
    light flickers on the uneven floor, where dust and decay thicken the air. The
    passage traps escapees, channeling the undead horde straight toward their prey
    and amplifying the chamber's suffocating terror.
  location_type: Narrow Underground Tunnel
  parent_location_uuid: null
- fabula_uuid: location_89ca2a95588f
  global_id: null
  canonical_name: Rooftop of Dracula’s Castle (Highest Terrace)
  description: "\n      The **highest exterior terrace** of Dracula’s Castle, accessible\
    \ via the grand staircase’s open doors. This circular rooftop, ringed by battlements\
    \ with a central tower, serves as the **climactic confrontation space** where:\n\
    \      - Jonathan Harker clut1ches the stone parapets, his half-transformed body\
    \ lashed by howling winds under jagged moonlight (one moment) and setting sunlight\
    \ (the next), save for the tower’s shadow where Dracula stands immune.\n     \
    \ - Dracula carries Harker onto this terrace, visible through the grand staircase’s\
    \ open double doors, bathed in blood-red sunset light. The terrace marks the **threshold\
    \ from Transylvania to England**, symbolizing the vampire’s global invasion.\n\
    \      - Harker’s primal oath of vengeance and Sister Agatha’s interruptions amplify\
    \ the horror, defiance, and supernatural dread of this exposed perch.\n      Distant\
    \ mountains frame the psychological clashes, while the terrace’s elevation and\
    \ open-air design contrast with the castle’s interior labyrinthine halls.\n  \
    \    "
  location_type: Castle Rooftop
  parent_location_uuid: null
- fabula_uuid: location_8fe75c4adf22
  global_id: null
  canonical_name: Second Highest Peak
  description: Dracula points to this towering mountain peak visible from Castle Dracula's
    highest terrace, noting how the sun sets behind it at this time of year. Its jagged
    silhouette frames the blood-red dusk, spilling crimson light across the rugged
    slopes and darkening valley below. The peak draws Dracula's poetic gaze, its beauty
    a tormenting reminder of daylight he cannot touch, while Jonathan Harker watches
    the sun vanish there, clinging to its fading warmth amid his captivity.
  location_type: Mountain Peak
  parent_location_uuid: null
- fabula_uuid: location_74d598562091
  global_id: null
  canonical_name: Shadows Beyond the Torchlight
  description: Dracula's presence haunts the shadows beyond the torchlight in the
    convent courtyard. A low, guttural growl rumbles from this dark fringe, where
    torch flames fail to reach. Nuns clutch stakes and chant against the encroaching
    evil, their light casting jittery patterns on the boundary. The space pulses with
    imminent threat, marking the threshold where the vampire's assault begins.
  location_type: Convent Courtyard Perimeter
  parent_location_uuid: null
- fabula_uuid: location_f4da4c8c3c0f
  global_id: null
  canonical_name: Sharma's Cabin (Demeter)
  description: Personal cabin of Dr. Sharma aboard the *Demeter*, serving as a flashback
    site for vampiric attacks and a bloodstained battlefield revealing the full horror
    of Dracula's predation. Distinct from other cabins by its intimate tie to Sharma's
    trauma and physical violence.
  location_type: Merchant Ship Cabin
  parent_location_uuid: null
- fabula_uuid: location_37bdb934fe59
  global_id: null
  canonical_name: Shifting Passageways
  description: Twisting stone corridors snake through Castle Dracula, walls pressing
    close in dim light as Jonathan Harker climbs stairs, crosses archways, and drops
    down steps—only to loop back to familiar courtyards and portraits. The passages
    shift without warning, forming a sentient maze that defies maps and logic. Frustration
    builds with each dead end; sweat beads on Harker's brow, his breaths shorten,
    and his rational mind frays against the castle's living trap, which strips away
    his control and foreshadows deeper horrors.
  location_type: Castle Labyrinth
  parent_location_uuid: null
- fabula_uuid: location_763d468ada84
  global_id: null
  canonical_name: Sister Agatha's Cabin
  description: Sister Agatha's cramped cabin aboard the Demeter confines her as the
    crew's paranoia boils over. Mob members burst through the door, seize the weakened
    nun, and drag her toward the ship's hold for brutal interrogation. The tight space
    heightens her vulnerability, its wooden walls reverberating with initial shouts
    of accusation. First shouts echo off the low ceiling as ropes bind her wrists,
    marking the cabin as the launch point for her transformation from hidden prisoner
    to mob target. Salt air seeps through portholes, mixing with the stench of fear
    and unwashed bodies crammed in the narrow room.
  location_type: Ship Cabin
  parent_location_uuid: null
- fabula_uuid: location_953e00b32ccd
  global_id: null
  canonical_name: Sokolov’s Cabin (Cabin Nine, Demeter)
  description: "\n      **Sokolov’s Cabin (Cabin Nine, Demeter)** is a dual-purpose\
    \ space aboard the *Demeter* that serves as both a *personal refuge* for Captain\
    \ Sokolov and a *battleground* for Dracula’s predatory violence. Originally a\
    \ confined, intimate space where Sokolov experiences psychological torment through\
    \ nightmares and moonlight-induced hallucinations (e.g., a severed hand crawling\
    \ onto his bunk), the cabin later becomes a bloodstained arena of struggle—its\
    \ walls and floor stained with fresh blood from vampiric assaults. The space oscillates\
    \ between:\n      - **Isolation**: A sealed chamber of decay, echoing with labored\
    \ breaths and sensory details (e.g., a fly crawling over the numeral 9), where\
    \ Sokolov’s personal horror unfolds.\n      - **Chaos**: A field of struggle marked\
    \ by broken furniture and scattered debris, reflecting the cabin’s transformation\
    \ into a site of violent defiance crushed by Dracula’s hunger.\n      The cabin’s\
    \ oppressive quiet, shifting between screams and silence, underscores its role\
    \ as a *microcosm* of the Demeter’s broader transformation into a 'floating abattoir,'\
    \ where human lives are reduced to ornamental prey in Dracula’s hierarchy.\n \
    \     "
  location_type: Ship Captain's Cabin
  parent_location_uuid: null
- fabula_uuid: location_2f0e741e916c
  global_id: null
  canonical_name: Staircase Beyond 'NO UNAUTHORIZED ACCESS' Sign
  description: Jack approaches the sign in tight Foundation corridors. Bold letters
    warn off intruders; flip-clock above ticks down to sunset, marking time until
    Dracula stirs. Stone walls echo footsteps, blending abbey's gothic age with clinical
    security. This threshold guards the vampire's cell, heightening dread as staff
    enforce rules mirroring the monster's restraint.
  location_type: Secure Facility Staircase
  parent_location_uuid: null
- fabula_uuid: location_d123813e9b1f
  global_id: null
  canonical_name: Street Near Graveyard (Night)
  description: Urban street adjacent to a graveyard, characterized by darkness, tension,
    and eerie isolation. Serves as the setting for Zev's urgent race down the street
    and Frank's idling car near the graveyard's edge.
  location_type: Urban Street Adjacent to Graveyard
  parent_location_uuid: null
- fabula_uuid: location_8a991f4ab1cb
  global_id: null
  canonical_name: Street Outside the Convent
  description: Mina slumps against the convent's rough stone wall under night cover,
    her ragged breaths echoing in the heavy silence that signals escape. Trembling
    hands pull the leather-bound notebook from hiding, pages parting to reveal cramped
    Dutch script and the stark *VAMPIEREN* title. The narrow street offers fleeting
    refuge, its shadows thick with residual pursuit dread and the notebook's ominous
    weight. Tension lingers as supernatural legacy binds her here, steps from the
    convent's sanctuary.
  location_type: Convent-Adjacent Street
  parent_location_uuid: null
- fabula_uuid: location_950d5750d8d2
  global_id: null
  canonical_name: Suburban Graveyard (Liminal Zone of Life and Death)
  description: A 1970s-era suburban graveyard that serves as a liminal space between
    life and death, where the mundane and the gothic collide. Under a night sky, small
    black gravestones dot the ground, some adorned with faded photos of the dead and
    rotting wreaths. Standing water taps gleam dully, and bloodstains mark Dracula's
    casual predation. The graveyard's utilitarian starkness clashes with its sinister
    atmosphere, where Lucy's romantic expectations are shattered as she witnesses
    Dracula swiping Tinder profiles amid the decay. The site is also characterized
    by tormented voices—women begging for light, men clawing for their lost faces,
    and a demonic child chanting 'Peek-a-boo… bloofer lady'—before materializing and
    vanishing. This duality of mundane suburban decay and gothic horror underscores
    the graveyard's role as a space of illusion-shattering and predatory tension.
  location_type: Suburban Graveyard
  parent_location_uuid: null
- fabula_uuid: location_ab5971e132a4
  global_id: null
  canonical_name: Threshold Behind the Double Doors
  description: Jonathan Harker navigates Castle Dracula's spiral staircase and branching
    corridors before reaching imposing double doors. He consults his map, pushes the
    doors open, and their slow swing reveals the space beyond. This threshold marks
    his shift from hesitation to confrontation, embodying the boundary between sanity
    and madness as he steps into deeper castle horrors amid growing dread.
  location_type: Castle Dracula Inner Threshold
  parent_location_uuid: null
- fabula_uuid: location_19bd219e64c6
  global_id: null
  canonical_name: Transylvania Countryside (Night - Mountain Roads & Rolling Hills)
  description: The expansive Transylvania countryside at night, encompassing both
    the treacherous mountain roads where Jonathan Harker's carriage races along a
    narrow, twisting path clinging perilously to the slopes, and the desolate rolling
    hills and shadowed valleys where Harker stands isolated after the carriage departs.
    The landscape itself resists and coils like a living entity, aiding Dracula's
    pursuit. Shadows swallow the peaks, and howling winds mingle with the carriage's
    clamor and Harker's ragged breaths, amplifying the supernatural dread. The terrain
    traps Harker in a desperate descent, its isolation and unseen horrors closing
    in from the darkness. The jagged silhouette of Dracula’s castle looms in the distance,
    its spires clawing the sky, while a possessed peasant girl thrusts a silver cross
    into Harker's hand, her demonic snarl echoing the supernatural corruption seeping
    from the castle. This location encompasses both the broader countryside, the specific
    mountain road where the pursuit unfolds, and the liminal ground underscoring Harker's
    vulnerability and the Count's far-reaching dominion.
  location_type: Mountain Countryside Road
  parent_location_uuid: null
- fabula_uuid: location_95696ec9b36e
  global_id: null
  canonical_name: Twisted Corridor Adjoining Harker's Chamber in Castle Dracula
  description: A singular, slanting corridor that connects to Jonathan Harker's chamber,
    characterized by warped geometry and labyrinthine properties. Serves as a transitional
    space where Harker *drags himself* and *launches his first defiance* through forbidden
    exploration.
  location_type: Castle Corridor
  parent_location_uuid: null
- fabula_uuid: location_dbff53a82f11
  global_id: null
  canonical_name: Unexplored Chamber Above Jonathan Harker's Prison-Like Cell in Castle
    Dracula
  description: A mysterious, unexplored room positioned directly above Jonathan Harker's
    prison-like chamber, serving as a target of his defiant exploration and rebellion
    against Dracula's warnings. Unlike his corrupted bedroom, this chamber remains
    unentered in the current narrative, its contents shrouded in shadows and silence,
    implying hidden secrets or potential revelations. Part of the labyrinthine corridors
    Jonathan crawls through, it represents a threshold to the unknown rather than
    a space of personal violation.
  location_type: Castle Upper Room
  parent_location_uuid: null
- fabula_uuid: location_860ff42daa1d
  global_id: null
  canonical_name: Urban Night Road (Dracula's Pursuit)
  description: A desolate urban road at night, where Dracula's sleek black car (or
    limousine) races through the darkness, headlights cutting through the enveloping
    blackness. This road serves as a battleground between ancient predatory power
    and modern urbanity, framing a temporal chasm—whether three months after Dracula's
    awakening or during his initial pursuit. The tension coils in the endless black
    ahead, amplifying the collision of immortal hunger against fleeting human resolve.
    Shadows press close, heightening the sense of isolation and predatory control
    as the vehicle advances toward an unseen destination. This location marks the
    divide between hunter and prey, where the road itself becomes a silent witness
    to the unfolding drama of Dracula's reign.
  location_type: Urban Roadway
  parent_location_uuid: null
- fabula_uuid: location_4c8c929596e5
  global_id: null
  canonical_name: Vaulted Hallway
  description: High vaulted arches frame the hallway visible beyond the castle's open
    doors after the bat attack. Flickering firelight dances across ancient stone,
    casting long shadows that hint at recent habitation amid gothic grandeur. Jonathan
    glimpses this warmly lit yet foreboding space as his first step inside, crossing
    from external terror into Dracula's domain where unseen threats await.
  location_type: Castle Entrance Hallway
  parent_location_uuid: null
- fabula_uuid: location_5d27be60b544
  global_id: null
  canonical_name: Warped Landscape Outside the Carriage
  description: Exterior location visible through the carriage window; serves as a
    symbolic threshold into Dracula's domain, characterized by its warped, occult-infused
    terrain.
  location_type: Supernatural Warped Wilderness
  parent_location_uuid: null
- fabula_uuid: location_0a1f21162522
  global_id: null
  canonical_name: Whitby Abbey
  description: Elevated gothic ruin visible from the Demeter and Whitby Shore; serves
    as a symbolic landmark for Dracula's arrival, framing his entry into England with
    its stark, moonlit silhouette.
  location_type: Clifftop Abbey Ruins
  parent_location_uuid: null
- fabula_uuid: location_1886cee59b7e
  global_id: null
  canonical_name: Whitby Beach
  description: Dracula surges from crashing waves onto Whitby Beach's rocky sands
    under storm-lashed skies, cliffs towering as helicopters buzz overhead and guards
    fire futile shots. Zoe Helsing and her team clash with him amid chaos of guns,
    bats swarming the night. Dawn breaks on pristine surfaces hiding bloodstains,
    elongated footprints, and churned sand from the struggle, tides erasing traces
    while Whitby town looms distant and unaware.
  location_type: Rocky Coastal Beach
  parent_location_uuid: null
- fabula_uuid: location_cea30eed7e6c
  global_id: null
  canonical_name: Whitby Clothing Storefront
  description: 'A clothing storefront on Whitby''s desolate streets bears marks of
    violation: security grill torn open with jagged edges from brute force under eerie
    control, shattered glass glittering inside like scattered teeth. A naked male
    mannequin stands exposed among others, its blank plastic eyes accusatory in the
    deliberate staging. This space of transformation, where identities shift through
    attire, now lies defiled as Dracula''s tableau of psychological warfare, mirroring
    vulnerability and forcing witnesses to face their own unraveling fragility.'
  location_type: Coastal Town Retail Storefront
  parent_location_uuid: null
- fabula_uuid: location_0b9c513f4d31
  global_id: null
  canonical_name: Whitby Town
  description: Whitby Town looms in the background beyond the bloodstained sands of
    Whitby Beach, its clustered buildings and streets bathed in daylight. Ordinary
    life pulses within—residents go about daily routines unaware of the supernatural
    violence erupting nearby. Footprints from the sea lead toward this oblivious haven,
    underscoring the sharp divide between mundane normalcy and hidden horror. The
    town stands as a silent witness, its presence heightening the isolation of the
    beach struggle.
  location_type: English Coastal Town
  parent_location_uuid: null
- fabula_uuid: location_db0d83706cb5
  global_id: null
  canonical_name: Whitby’s Predawn Abandoned Streets
  description: A liminal, predawn space embodying Whitby’s curse, introduced through
    eerie silence, long shadows, and a newspaper clue about a fridge death. Serves
    as the town’s atmospheric backbone, setting the stage for supernatural dread.
  location_type: Abandoned Town Streets
  parent_location_uuid: null
- fabula_uuid: location_39060d60baf5
  global_id: null
  canonical_name: Whitby’s Violated Clothing Shop District
  description: Urban core of Whitby, characterized by abandoned storefronts, shattered
    glass, and signs of precise physical violation. Serves as the primary site of
    the 'hunt' and the decay of modern structures.
  location_type: Provincial Town Streets
  parent_location_uuid: null
- fabula_uuid: location_b619f6e96db4
  global_id: null
  canonical_name: Wine Cellar Doorway (Castle Interior)
  description: A secondary threshold within Dracula’s castle, marking Sister Agatha’s
    psychological descent into vulnerability. Distinct from the castle’s main entrance
    by its interior location, intimate scale, and sensory focus on wine and gaslight.
  location_type: Wine Cellar Doorway
  parent_location_uuid: null
- fabula_uuid: location_3f78a3302a69
  global_id: null
  canonical_name: Zoe's Oncology Ward
  description: A sterile oncology ward room where Zoe Van Helsing is confined during
    her cancer treatment. The space is dominated by clinical equipment—humming IV
    drips, beeping monitors, and stark white walls—while tabloids and magazines (including
    Dracula-themed content) are strewn across her bed. The room serves as both a prison
    of her failing body and a focal point for her undimmed hunter's instincts, where
    mortality and predatory drive collide. Harsh fluorescent lights buzz over linoleum
    floors, amplifying her physical frailty and existential isolation. Later, the
    space transforms into a battleground as Zoe demands discharge over the phone,
    asserting her defiance against illness and medical control.
  location_type: Hospital Patient Room
  parent_location_uuid: null
- fabula_uuid: location_01451f78416c
