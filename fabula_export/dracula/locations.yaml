  canonical_name: Delside Crematorium Chapel
  description: |-
    The **Delside Crematorium Chapel** is the primary location for Lucy Westenra's funeral in 1897, where mourners gather in solemn grief under the weight of her death. The chapel, part of the **Delside Crematorium** complex, features:
      - **Interior**: Packed wooden pews, stone walls, and heavy curtains separating the ceremonial space from the industrial furnace area. The atmosphere is sterile yet oppressive, with echoes of prayers and sobs amplifying the tension between mortality and the lurking supernatural.
      - **Key Events**:
        - The vicar recites *'In the midst of life we are in death'* over stunned silence, while Jack Seward glares at Quincey Morris’s packed suitcase (a subtle foreshadowing of the hunt for Dracula).
        - Lucy’s coffin glides behind curtains toward the furnace, but her **reanimated, charred form** twists inside, mouthing unheard screams of *'Help me!'*—a chilling hint of Dracula’s curse.
      - **Narrative Role**: This space serves as the nexus where grief, guilt, and the supernatural collide. The funeral’s ritualistic solemnity contrasts with the industrial sterility of the crematorium, underscoring the story’s themes of **mortality vs. immortality** and the **horrors lurking beneath the surface of Victorian society**. The chapel’s design (stone/wood) and acoustic properties (echoes) heighten the unease, while the furnace’s presence foreshadows Lucy’s **twice-death** (first by Dracula, second by cremation).
  location_type: Crematorium Chapel
  parent_location_uuid: null
