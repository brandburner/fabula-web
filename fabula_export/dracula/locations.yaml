- fabula_uuid: location_c44efc782b7b
  global_id: null
  canonical_name: Convent (Jonathan's Room / Candlelit Chamber)
  description: 'A claustrophobic convent bedroom where Jonathan Harker''s vampiric
    transformation unfolds, serving as both a sacred sanctuary and a site of profane
    horror. Sunlight streams through a window with a view of the town, illuminating
    a simple room distinguished by a crucifix on the wall. The space oscillates between
    sacred and profane: Sister Agatha interrogates Jonathan about Dracula here, revealing
    a stake and hammer from her bag, while a fly crawling across his face and emerging
    from his mouth exposes his corruption. Later, the room becomes a site of horror
    as Jonathan''s claw-like hand snatches a wooden stake from Mina''s grip during
    his vampiric transformation, his tear-filled crimson eyes turning the point toward
    his own chest. The walls amplify the despair as Mina whispers an apology and flees,
    abandoning hope amid the irreversible curse. The chamber is also described as
    a candlelit space where Jonathan delivers fragmented accounts of his horrors,
    with nuns clustering defensively around stakes and holy symbols, heightening the
    tension between rational doubt and primal fear. The room''s dual role—both sanctuary
    and prison—heightens the psychological tension, as the ''house of God'' fails
    to shield against encroaching evil.'
  location_type: Convent Bedroom
  parent_location_uuid: null
- fabula_uuid: location_7d14d6fa60c8
  global_id: null
  canonical_name: Convent Cloistered Halls (Sanctum)
  description: 'The convent''s stone-floored cloistered halls and innermost sanctum,
    once a sanctuary, become a battleground where the Mother Superior''s decapitated
    body pools blood across the cold slabs. Flickering candlelight casts elongated
    shadows as nuns chant in desperation, their stakes forming a semicircle before
    Dracula''s arrival silences them. The air thickens with damp earth and iron scents,
    whispers of prayer turn to screams, and shadows stretch long as the vampire breaches
    the walls. Jonathan Harker reunites briefly with Mina here before the final refuge
    crumbles under the assault. **Key distinguishing feature**: This location is explicitly
    tied to the **Mother Superior''s death** and **Dracula''s shadow stretching across
    the walls**, which are not mentioned in the broader ''Hungarian Convent'' entity.'
  location_type: Convent Cloisters
  parent_location_uuid: null
