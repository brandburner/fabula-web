    furnace room**, where the actual cremation occurs amid deafening roars, acrid
    smoke, and supernatural agony. The camera captures Lucy’s reanimated, charred
    body thrashing in the casket before flames consume her remains, marking a grotesque
    ritual of fire and irreversible finality. Clinical detachment clashes with the
    horror of interrupted annihilation, as oblivious mourners linger beyond the curtains.'
