- fabula_uuid: location_5c2f966b9f1c
  global_id: null
  canonical_name: Demeter Passenger Lounge/Dining Room
  description: |-
    The **Demeter Passenger Lounge/Dining Room** is a dual-purpose space aboard the ship, blending shabby glamour with cramped, storm-battered functionality. Initially described as a glamorous lounge where Grand Duchess Valeryia sits alone before being joined by Lord Ruthven, Adisa, Dr. Sharma, and Yamini, the space later becomes a tense dining room where survivors huddle over meager meals amid escalating paranoia. Key narrative beats include:
      - **Class-laden banter** between passengers (Valeryia, Ruthven, Adisa, Sharma, Yamini) before Dracula’s arrival.
      - **Dracula’s seduction of Valeryia**, his brief departure to feed on Portmann, and his return fluent in German, heightening social tensions.
      - **Adisa’s accusations against Ruthven** over Dorabella’s death, fracturing the group’s fragile cohesion.
      - **Dracula’s violent intrusion**, where his feral hunger (focused on rare mutton and Abramoff’s blood-soaked bandage) shatters the standoff into prelude to slaughter.
      - **Crew gatherings** where Sokolov rallies members to confront disappearances, and Dracula’s measured accusations ignite paranoia, further fracturing trust.
      The space’s **flickering lights and half-eaten meals** symbolize the unraveling civility, while its **dual role as lounge/dining room** reflects the ship’s overcrowded, desperate conditions. Storm-induced dimness and salt-laden air amplify the claustrophobic dread.
  location_type: Sailing Ship Passenger Lounge
  parent_location_uuid: null
