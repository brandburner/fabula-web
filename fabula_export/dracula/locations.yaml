  canonical_name: Zoe’s Ward Window
  description: 'Daylight filters through the window in Zoe’s hospital ward, framing
    the silent spectral figure of Sister Agatha, her Van Helsing ancestor. Zoe awakens
    to the vision amid the room’s sterile antiseptic glow, but the nun vanishes the
    instant Jack Seward enters. The glass pane marks a sharp divide: clinical hospital
    recovery on one side, supernatural glimpses of lineage and Dracula’s looming battle
    on the other. Tension builds as Zoe’s perceptions sharpen despite her weakness.'
