- fabula_uuid: location_9425de0cafd9
  global_id: null
  canonical_name: Demeter's Hold
  description: |-
    The cramped, dimly lit cargo hold of the *Demeter*, a space of shifting fortunes, escalating tension, and vampiric deception. Initially a claustrophobic interrogation chamber where the crew's paranoia erupts into violence against Agatha (bound and dragged here for questioning), it later transforms into a flooded, fire-ravaged battleground. The hold's confined walls amplify chaos—whether through the crew's hysterical shouts, Agatha's desperate struggle against ropes, or the cataclysmic finale where Sokolov ignites gunpowder barrels amid rising seawater. Stacked with fifty wooden boxes packed with mouldering earth, the space serves as a vampiric refuge (hiding Dracula’s coffin) while distracting the crew from its true purpose. Damp air carries the heavy scent of decay, wet soil, and salt, with flickering lantern light casting uneasy glows on the crates. Key narrative moments include:
            - **Scientific skepticism**: Sharma probes the contents with scientific doubt.
            - **Supernatural foreboding**: Old Valentin mutters of dark forces; Adisa stands watchful.
            - **Dracula’s deception**: He feigns ignorance while the hold conceals his coffin.
            - **Earlier secrets**: Echoes of Piotr’s shadowed encounter (sparking Agatha’s suspicions) linger in the space.
            - **Crew violence**: Agatha is bound and interrogated here, amplifying the hold’s role as a space of fear and chaos.
            The hold’s creaking timbers and confined darkness amplify its role as a liminal space—where corruption festers, predator and prey are trapped, and the crew’s attention is deliberately misdirected. The space ultimately floods and collapses as the *Demeter* sinks.
  location_type: Ocean Steamer Hold
  parent_location_uuid: null
