- fabula_uuid: organization_35df59e9d646
  global_id: null
  canonical_name: Crew of the Demeter
  description: Operational workforce of the *Demeter* under Captain Sokolov, distinct
    from passengers. Their roles include ship maintenance, cargo handling (e.g., coffin-like
    crates), and navigation, with a narrative arc centered on professional unraveling
    and mutiny.
  sphere_of_influence: Maritime Shipping Operations and Voyage Crew
- fabula_uuid: organization_d26309020e37
  global_id: null
  canonical_name: Donor Program
  description: Zoe Helsing recommended Jack Seward join the Donor Program to earn
    quick cash for college tuition. This initiative directly linked Jack to Dracula,
    sparking Zoe's deep regret and exposing the program's ethical pitfalls. Participants
    provide something valuable—likely blood or essence—to supernatural entities, turning
    financial aid into a gateway for vampiric entanglement and resurrection risks.
  sphere_of_influence: Human Donor Recruitment for Supernatural Sustenance
- fabula_uuid: organization_bc2eb00b9abf
  global_id: null
  canonical_name: Dracula’s Coven (Vampiric Organization)
  description: 'The overarching vampiric organization serving Dracula, composed of
    two tiers: (1) the **Undead Brides** (elite, supernatural enforcers) and (2) **reanimated
    corpses** (expendable undead network). Operates beyond the castle, focusing on
    external infiltration (e.g., desecrating holy ground, compromising sanctified
    spaces) and strategic expansion toward England. Distinct from the brides as it
    includes non-elite undead and functions as a broader power structure.'
  sphere_of_influence: Vampiric Infiltration and Undead Propagation
- fabula_uuid: organization_c308034fb7d9
  global_id: null
  canonical_name: Dracula’s Undead Brides (Elite Enforcers)
  description: A trio of named or individually referenced supernatural thralls bound
    directly to Dracula’s will, operating exclusively within his castle. Their role
    is symbolic and psychological, centered on enforcing loyalty (e.g., Elena’s defiance
    and execution) and breaking Jonathan Harker’s resistance. Distinct from the broader
    coven as they lack the reanimated corpses’ network and external infiltration functions.
  sphere_of_influence: Vampiric Servitude and Psychological Torment
- fabula_uuid: organization_7858b1418867
  global_id: null
  canonical_name: England's Refined Society
  description: England's Refined Society consists of the country's intelligent and
    sophisticated people, whom Dracula targets for feeding to absorb their qualities
    and elevate his own refinement and power. He uses Jonathan Harker as a vessel
    to reach England's shores, declaring this group his harvest in a calculated move
    from personal predation to transnational conquest. The society's cultural elite
    status marks it as the focal point of the vampire's invasion ambitions.
  sphere_of_influence: Social and Cultural Elite of England
- fabula_uuid: organization_22b096bbfbb0
  global_id: null
  canonical_name: Hawkins & Co. (Law Firm, 1893)
  description: 19th-century law firm (1893) specializing in real estate conveyancing,
    employed by Count Dracula to facilitate his schemes. Weaponized to detain Jonathan
    Harker in Transylvania under false pretenses of unfinished legal work.
  sphere_of_influence: Real Estate Conveyancing and Legal Services
- fabula_uuid: organization_3c5844212cba
  global_id: null
  canonical_name: Hawkins and Wentworth (Law Firm, 1896+)
  description: Modern/near-modern law firm (post-1896) representing Count Dracula’s
    legal rights and inheritance, led by Frank Renfield. Actively contests the Jonathan
    Harker Foundation’s containment efforts, exposing Dracula’s century-old legal
    preparations.
  sphere_of_influence: Legal Representation, Resettlement, and Asset Management for
    Supernatural Clients
- fabula_uuid: organization_0bd325a8f98c
  global_id: null
  canonical_name: Hungarian Convent of the Holy Order
  description: Physical sanctuary for Jonathan Harker and Mina Murray after their
    encounters with Dracula, serving as a hub for **supernatural resistance** (stakes,
    hammers, faith-based defenses) and **occult documentation**. Later compromised
    by Dracula’s influence, shifting from protector to target.
  sphere_of_influence: Religious Refuge and Supernatural Resistance
- fabula_uuid: organization_71503e7aa4d7
  global_id: null
  canonical_name: Jonathan Harker Foundation
  description: The Jonathan Harker Foundation (commonly referred to as the 'Harker
    Foundation') is a high-security organization dedicated to containing and studying
    Dracula. Founded by Mina Murray in collaboration with Sister Agatha's family,
    it operates from a repurposed Gothic abbey near Whitby, featuring chapels for
    briefings, surgical suites, and other specialized facilities. Led by Zoe Helsing—a
    descendant of the Van Helsing lineage—the foundation employs advanced surveillance
    (phones, trackers), blood-type recruitment, and medical procedures to maintain
    control over Dracula. Key personnel include Bloxham and the Commander, who oversee
    guards, workmen, and operational logistics. The foundation faces legal and ethical
    challenges, including lawsuits from Frank Renfield over occult funding, mercenary
    use, cover-ups, and the ethical implications of indefinite detention. In active
    operations, the foundation deploys tactical measures such as labeled caskets,
    roof removal, and sunlight flooding to neutralize threats, as seen in high-stakes
    standoffs (e.g., the confrontation at Kathleen’s house).
  sphere_of_influence: Vampire Containment, Research, and Neutralization
- fabula_uuid: organization_22a19f20fa56
  global_id: null
  canonical_name: Modern Military Authorities
  description: Modern Military Authorities mobilize helicopters, spotlights, armed
    soldiers wielding machine guns, and black cars to confront Dracula immediately
    after he reaches Whitby shore. They encircle him with superior firepower and technology,
    stripping away his dominance and casting him as prey. This coordinated operation
    counters his invasion, leveraging 21st-century assets to neutralize the ancient
    vampire and enforce national security against supernatural threats.
  sphere_of_influence: Contemporary Military Response and National Defense
- fabula_uuid: organization_08f3333c936a
  global_id: null
  canonical_name: Passengers of the Demeter
  description: Aristocratic travelers aboard the *Demeter*, distinct from the ship’s
    crew. Their roles include boarding as paying guests, displaying varied awareness
    of supernatural threats, and serving as targets for Dracula’s manipulations.
  sphere_of_influence: Aristocratic Travelers and Supernatural Prey Aboard the Demeter
- fabula_uuid: organization_d7cf5e34107a
  global_id: null
  canonical_name: Police
  description: Frank Renfield names the Police as recipients for details on the Harker
    Foundation's beach incident cover-up, casting them as an external force that endangers
    secrecy. He threatens Police involvement to coerce Bloxham and Zoe into silence,
    exploiting the Foundation's exposure to criminal investigation and prosecution.
    Their role underscores tensions between supernatural containment efforts and civilian
    legal accountability in a modern bureaucratic landscape.
  sphere_of_influence: Civilian Law Enforcement and Criminal Investigation
- fabula_uuid: organization_b71245ea83ff
  global_id: null
  canonical_name: St. Mary’s Convent (Budapest)
  description: Symbolic anchor for Sister Agatha Van Helsing’s undead vigilance and
    spectral guidance to Zoe Helsing, rooted in historical devotion and the blood
    pact for vengeance/atonement. Geographically tied to Budapest.
  sphere_of_influence: Religious Convent and Ancestral Supernatural Resistance
- fabula_uuid: organization_8973ff81d918
  global_id: null
  canonical_name: The Church
  description: Sister Agatha describes The Church as a collapsed religious institution
    where the roof caved in and killed the entire congregation. She wields this disaster
    to prove God offers no safeguard against calamity, pressing Jonathan Harker to
    doubt the convent's security. The example spotlights institutional fragility amid
    vows of divine shelter.
  sphere_of_influence: Religious Congregation and Worship
- fabula_uuid: organization_3a08d2902067
  global_id: null
  canonical_name: The Press
  description: Frank positions the press as shapers of public labels, dubbing Dracula
    a 'refugee' shipwreck survivor despite his orchestration. He wields it as a blackmail
    tool, threatening to leak Harker Foundation mercenary gossip for scrutiny and
    exposure. This role amplifies legal maneuvers, forcing Bloxham's silence and Zoe
    Helsing's frustration in the briefing room standoff.
  sphere_of_influence: Media Scrutiny and Public Narrative Control
